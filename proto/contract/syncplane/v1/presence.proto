syntax = "proto3";

package syncplane.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/levelfourab/syncplane/engine/gen/syncplane/v1;syncplanev1";

// Manages ephemeral presence state and broadcast messaging for active
// connections.
//
// Presence state includes transient data such as cursors, selections, typing
// indicators, and active viewers. This data is not durable, is not stored in
// the mutation log, and is not replayed to later readers.
//
// The service provides two RPCs:
// - `Watch` streams presence snapshots and real-time updates to a subscriber.
// - `Publish` sends presence updates, broadcast messages, and departure notices
//   from a publisher.
service PresenceService {
	// Streams presence updates and broadcast messages for a fixed set of
	// topics.
	//
	// The stream first sends a `RoomSnapshot` for each watched topic, followed
	// by participant updates, departures, and broadcast messages as they
	// occur. The set of watched topics is fixed for the lifetime of the
	// stream. To change topics, close and reopen the stream.
	//
	// Delivery is at-most-once and unordered across topics. Dropped presence
	// updates are corrected by periodic re-announcements, but dropped
	// broadcast messages are not replayed.
	rpc Watch(WatchRequest) returns (stream WatchResponse);
	// Publishes presence state updates, broadcast messages, or departure
	// notices for a session.
	//
	// The server assigns the participant identity from the request principal.
	// The request payload cannot specify or override the sender identity.
	rpc Publish(PublishRequest) returns (PublishResponse);
}

// Addresses one room. Scoped to a workspace and is either anchored to a
// row or not.
//
// An anchored topic (entity and key both set) inherits that row's read
// permission: a caller is admitted only if the app's ReadFilter would let
// them read the row.
//
// An unanchored topic (entity and key both empty) is gated on workspace
// access alone plus the app's own room hook when it installs one.
message Topic {
	// The identifier of the workspace containing the room.
	string workspace_id = 1;
	// Names the room within the workspace. Free-form, but subject to the
	// room-name rule in docs/reference/naming.md; two callers naming the
	// same string are in the same room.
	string name = 2;
	// The entity name of the anchor row, or empty if the topic is unanchored.
	// Set together with `key`.
	string entity = 3;
	// The row key of the anchor row, or empty if the topic is unanchored. Set
	// together with `entity`.
	string key = 4;
}

// Contains a session's transient state within a single room.
message PresenceUpdate {
	// The application-defined state payload, opaque to the engine, and
	// capped by the server's `MaxPresenceStateBytes` limit, which defaults
	// to 4 KiB. An empty state indicates presence with no additional
	// payload.
	bytes state = 1;
	// The monotonic revision number assigned by the publisher for this session
	// and topic. Recipients discard updates with a lower revision than the
	// highest revision received.
	uint64 revision = 2;
	// The workspace sequence number that the publisher was at when authoring
	// this state. If 0, the publisher did not specify a sequence number.
	// Recipients use this value to determine whether their local data stream
	// needs to catch up.
	uint64 seq = 3;
}

// Participant is one session's record in one room, as a watcher sees it.
message Participant {
	// The publishing session. Stable for as long as that session lives, and
	// distinct from the client id: one device may hold several sessions, and
	// the client id is an idempotency handle rather than an identity.
	string session_id = 1;
	// Who is publishing, taken from the request principal at publish time.
	// Empty when the publisher was unauthenticated. Never client-supplied.
	string subject = 2;
	// The participant's transient presence state within the room.
	PresenceUpdate presence = 3;
}

// RoomSnapshot is the roster of one topic as the serving node knows it, sent
// once when the topic is joined.
//
// It is a node-local view, not global truth: a node knows the sessions whose
// streams it holds plus whatever the bus has told it about the rest. A record
// that has not been re-announced within the expiry window is absent from it.
message RoomSnapshot {
	// Every participant the node knows of, the joining session included.
	repeated Participant participants = 1;
	// True when the roster was cut to MaxParticipantsPerRoom. The kept prefix
	// is ordered by session id, so every recipient of the same roster keeps the
	// same participants.
	bool truncated = 2;
}

// RoomMessage is one broadcast: an ephemeral payload delivered to whoever is
// watching the topic at the moment it arrives. It is not stored, not replayed
// and not acknowledged.
message RoomMessage {
	// The session that sent it.
	string sender_session_id = 1;
	// Who sent it, stamped from the request principal. Empty when the sender
	// was unauthenticated.
	string sender_subject = 2;
	// App-defined, opaque to the engine, capped by MaxBroadcastBytes.
	bytes payload = 3;
}

// TopicDropped ends one topic's participation in a Watch stream. The server
// sends nothing further for that topic; every other topic keeps streaming.
//
// It reports only per-topic outcomes. A request that exceeds a limit — too many
// topics, too many fronted sessions, an oversize payload — fails the whole RPC
// with resource_exhausted instead, because the stream never opens.
message TopicDropped {
	// Specifies the reason why a topic was dropped from a watch stream.
	enum Reason {
		// Default value. The reason is unspecified.
		REASON_UNSPECIFIED = 0;
		// The join gate refused this caller, permanently: workspace access was
		// revoked, the anchor row is no longer readable, or the app's room hook
		// said no. Stop showing the room; retrying will not change the answer.
		REASON_ACCESS_REVOKED = 1;
		// A failure scoped to this topic that may not persist (a storage error,
		// a permission hook that could not decide). Reopen with backoff.
		REASON_ERROR = 2;
		// The caller holds no permission in the workspace's access model. A
		// grant written later lifts it, so the room can be reopened with
		// backoff. It is the room's form of WorkspaceDropped.REASON_NO_ACCESS.
		REASON_NO_ACCESS = 3;
	}
	// The reason why the topic was dropped.
	Reason reason = 1;
	// Human-readable detail for logs. Never parse it; branch on reason.
	string message = 2;
}

// Request to watch presence updates and broadcast messages for a set of
// topics.
message WatchRequest {
	// Identifies the watching session, and is the session a Publish on this
	// account writes as. Minted by the client, per tab: it is what a departure
	// and an expiry are keyed on. The server binds it to the caller's principal
	// for the life of the stream.
	string session_id = 1;
	// The rooms to watch. At least one; duplicates are rejected, and the
	// server caps the count (see Limits.MaxRoomsPerStream). The set is fixed
	// for the life of the stream.
	repeated Topic topics = 2;
	// Caps the participants in each RoomSnapshot. 0 means "server default"; the
	// server clamps to its own maximum either way.
	uint32 limit = 3;
	// Other sessions this stream is responsible for keeping alive.
	//
	// A record survives because the node holding its session's stream
	// re-announces it, so a session with no stream anywhere is forgotten within
	// the expiry window — which is exactly what should happen to one whose
	// process died. But a browser shares ONE stream across an account's tabs,
	// and the tabs that are not holding it still publish their own presence.
	// Naming them here is what stops a room emptying out to whichever tab
	// happens to hold the lock.
	//
	// A stream keeps alive only the records its own principal wrote. Naming a
	// session whose record another principal wrote does not fail the stream,
	// and does not keep that record alive. The list is fixed for the life of
	// the stream, so a tab that opens or closes is a reopen — the same reopen a
	// room change already costs.
	repeated string fronted_session_ids = 4;
}

// WatchResponse is one frame of the stream, always naming the topic it
// concerns — except a heartbeat, which is stream-level.
message WatchResponse {
	// The topic this frame is about. Unset only on a heartbeat.
	Topic topic = 1;

	// The event payload received for the topic.
	oneof body {
		// The roster of this topic at join time. Sent once per topic, before
		// any other frame for it; a client replaces whatever it held.
		RoomSnapshot snapshot = 2;
		// A participant joined, or changed its state. Apply it as
		// last-writer-wins by PresenceUpdate.revision — a re-announcement of a
		// record the client already holds arrives as one of these.
		Participant updated = 3;
		// The session that left, by session id. Sent when a session published
		// a departure and when its record expired without being re-announced;
		// the two are indistinguishable, and deliberately so.
		string left = 4;
		// A broadcast from another session, or from this one — the sender is
		// not excluded, so an app that echoes locally must filter on
		// sender_session_id.
		RoomMessage message = 5;
		// This topic has left the stream; see TopicDropped.
		TopicDropped dropped = 6;
		// Liveness keepalive for the whole stream. Carries no topic and no
		// payload.
		bool heartbeat = 7;
	}
}

// PublishItem is one write to one room.
message PublishItem {
	// The topic to publish to.
	Topic topic = 1;

	// The update, message, or departure notice to publish.
	oneof body {
		// Replace this session's state in the topic. Wholly replaces the
		// previous state — there is no field mask and no merge, because soft
		// state is re-sent in full on every announce anyway.
		PresenceUpdate presence = 2;
		// Broadcast a payload to whoever is watching the topic now. At most
		// once, to nobody if nobody is there.
		bytes message = 3;
		// Withdraw this session from the topic. Watchers see it as `left`
		// immediately rather than waiting out the expiry window, which is what
		// makes closing a document feel instant.
		bool leave = 4;
	}
}

// Request to publish presence updates, broadcast messages, or departure
// notices for a session.
message PublishRequest {
	// The publishing session, as named on this account's Watch stream. When
	// the serving node holds Watch streams for the session and none of them
	// is the caller's, the request is rejected with permission_denied.
	string session_id = 1;
	// The writes, applied in order. At least one, and at most
	// Limits.MaxPublishItems. Items are independent: there is no atomicity
	// across them and none is implied.
	repeated PublishItem items = 2;
}

// Response containing publication timing parameters for the session.
message PublishResponse {
	// How often a publisher holding no Watch stream must re-publish to keep its
	// records alive, and the interval the serving node re-announces on.
	//
	// A record survives because some node re-announces it, and a node does that
	// only for the sessions whose streams it holds. A publisher with no stream
	// anywhere is therefore kept alive by its own publishes alone, and lapses
	// three of these intervals after the last one. Re-publishing the same state
	// at its existing revision refreshes liveness without costing watchers a
	// frame.
	//
	// A client that holds a Watch stream can ignore this — the node serving the
	// stream is already doing it.
	google.protobuf.Duration announce_interval = 1;
}
