syntax = "proto3";

package syncplane.v1;

import "google/protobuf/descriptor.proto";
import "syncplane/v1/query.proto";

option go_package = "github.com/levelfourab/syncplane/engine/gen/syncplane/v1;syncplanev1";

// Declares a message as a syncable entity.
message EntityOptions {
	// The logical entity name used on the wire and in storage, for example
	// `"todo"`.
	string name = 1;
	// The field names whose values form the row key, in order.
	repeated string key_fields = 2;
	// Composite secondary indexes over the fields of this entity.
	//
	// Declare a composite index when a query filters on one field and orders
	// by another. A single-field index serves that query only by scanning the
	// sort order and rechecking candidate rows.
	//
	// Secondary indexes do not change request or response payloads, and
	// queries return identical rows in identical order with or without an
	// index. Adding or removing an index is not a breaking change.
	//
	// Writes to this entity re-encode and update the row position in every
	// declared index.
	repeated IndexSpec index = 3;
	// Specifies whether rows of this entity stay on the server only.
	//
	// When `true`, rows are never bootstrapped, pulled, or streamed to
	// clients. Client mutations and subscriptions that name this entity fail.
	//
	// Server-side reads, including the `Query` RPC, in-process view APIs, and
	// mutators, can still access the entity.
	bool server_only = 5;
	// Configures append-only history tracking for field changes on this
	// entity.
	//
	// See `HistoryOptions`.
	HistoryOptions history = 6;
	// Configures full-text search over the fields of this entity.
	//
	// Fields marked with `(syncplane.v1.field_behavior).searchable` are
	// indexed first in field order, followed by the fields declared in this
	// search specification. See `SearchSpec`.
	SearchSpec search = 9;
	// Declares who can read and write the rows of this entity in the access
	// model.
	//
	// A schema uses the access model when any of its entities declares
	// `access` or `grant`. An entity in such a schema that declares no
	// `access` is outside the model: every caller admitted to the workspace
	// reads and writes its rows, and no rule or access parent applies to
	// them. A server built with `WithStrictAccess` refuses such an entity.
	// See `AccessOptions`.
	AccessOptions access = 10;
	// Declares the rows of this entity as grant rows: each row gives one
	// subject one role at the row's anchor.
	//
	// A grant entity must also declare `access`. See `GrantOptions`.
	GrantOptions grant = 11;
	// Declares the rows of this entity as teams: a grant row can name a row of
	// this entity as its subject, and then grants to every member of that row.
	//
	// See `MembersOptions`.
	MembersOptions members = 12;

	reserved 4, 7, 8;
	reserved "delete_policy", "create_policy", "update_policy";
}

// Declares who can read and write the rows of an entity in the access model.
//
// A caller holds a permission at an anchor: the workspace root, or one row
// that a grant row's `access_parent` field points at. A permission held at
// an anchor applies to the anchor row and to every row below it: the rows
// whose `access_parent` field points at it, the rows whose `access_parent`
// field points at those, and so on. A row whose `access_parent` field is
// unset, or names a row that does not exist, has no parent and never falls
// back to the workspace root. See `GrantOptions` and `AccessParentOptions`.
//
// An operation on a row is allowed when at least one rule in `allow` admits
// it. A rule only adds access: no rule takes away what another rule allows,
// and the order of the rules has no effect. An operation that no rule names
// is open only to trusted writes, such as connectors, effects and mutator
// bodies.
//
// ```protobuf
// message Comment {
//   option (syncplane.v1.entity) = {
//     name: "comment" key_fields: ["id"]
//     access: { allow: [
//       { read: true requires: "view_tasks" },
//       { create: true requires: "comment" },
//       { update: true delete: true requires: "moderate_comments" }
//     ] }
//   };
//   string id = 1;
//   Task task = 2 [(syncplane.v1.field_behavior).access_parent = {}];
// }
// ```
//
// Registration refuses a permission that no declared role grants, and a role
// that grants a permission no rule uses, so a misspelled name fails on either
// side.
//
// The application permission hooks still run, and can refuse what the
// model allows. They cannot allow what the model refuses.
//
// Registration refuses unknown fields inside this message.
message AccessOptions {
	// The rules. At least one, and no two the same.
	repeated AccessRule allow = 1;
}

// One way to read or write the rows of an entity.
//
// A rule admits each operation it names when its source holds for the caller
// and every check it sets holds, on the row: for a read, the row; for a
// create, the row as it will be stored; for a delete, the stored row. An
// update must be admitted by one rule for both the stored row and the row as
// it will be stored, so a rule admits a write that moves a row to another
// access parent only when its source holds at the old place and at the new
// one, a rule with `subject` admits no write that changes the subject field
// to a value outside the caller's subjects, and a rule with `when` admits no
// write that makes the row fail the condition.
//
// ```protobuf
// message Comment {
//   option (syncplane.v1.entity) = {
//     name: "comment" key_fields: ["id"]
//     access: { allow: [
//       { read: true requires: "view_tasks" },
//       { create: true delete: true
//         requires: "comment" subject: "author_id" },
//       { update: true requires: "comment"
//         subject: "author_id" fields: ["body"] }
//     ] }
//   };
//   string id = 1;
//   Task task = 2 [(syncplane.v1.field_behavior).access_parent = {}];
//   string author_id = 3 [(syncplane.v1.field_behavior).creator = {}];
//   string body = 4;
// }
// ```
//
// Registration refuses a rule without an operation, a rule that sets neither
// or both of `requires` and `admitted`, and unknown fields inside this
// message.
message AccessRule {
	// Admits reading rows.
	bool read = 1;
	// Admits creating rows.
	bool create = 2;
	// Admits changing rows that exist, including moving them to another access
	// parent.
	bool update = 3;
	// Admits deleting rows.
	bool delete = 4;
	// Admits every write operation: `create`, `update` and `delete`, and each
	// write operation a later version adds.
	bool write = 5;

	// The source of the rule: a caller that holds every one of these
	// permissions where the row sits, at the workspace root, at the row, or at
	// a row up the row's chain of access parents. Each permission can be held
	// at a different one of these places. Each entry starts with a letter or
	// an underscore, followed by letters, digits and underscores, and no entry
	// is named twice.
	//
	// The text format writes one permission without brackets:
	//
	// ```protobuf
	// access: { allow: [
	//   { read: true requires: "view_tasks" },
	//   { update: true requires: ["edit_tasks", "use_billing"] }
	// ] }
	// ```
	//
	// A caller that holds `edit_tasks` at the task's project and `use_billing`
	// at the workspace root updates the task. A caller that holds only one of
	// them does not. To admit a caller that holds either of two permissions,
	// declare two rules.
	repeated string requires = 6;
	// The source of the rule: every caller admitted to the workspace. See
	// `AdmittedCaller`.
	AdmittedCaller admitted = 7;

	// Admits only rows whose field with this name holds one of the caller's
	// subjects. Names a top-level, singular `string` field. An empty field
	// value never matches, and a permission held at the workspace root does not
	// skip the check. A member of a `oneof` is empty on a row that holds
	// another case, so it never matches there.
	string subject = 8;
	// Admits only updates that change no field outside this list. Valid only
	// on a rule whose one operation is `update`. Each entry names a top-level
	// field outside any `oneof`, or a `oneof`, and no key field. A move
	// changes the access parent field, so the rule admits a move only when the
	// list names that field or its `oneof`.
	//
	// A `PATCH` fails before the row is read when every `update` rule of the
	// entity has a `fields` list and no list names every field the mask
	// names.
	repeated string fields = 9;
	// Admits only rows that match this condition. The condition uses the query
	// predicate language with paths from the row, and reads only the row
	// itself: a `rel` or a `match` condition is refused.
	//
	// A read rule with `when` hides a row when a write makes it fail the
	// condition, and a client that holds the row receives a delete. An update
	// rule with `when` must admit the stored row and the row as it will be
	// stored, so it refuses a write that makes a row fail the condition, and
	// a write to a row that fails it:
	//
	// ```protobuf
	// access: { allow: [
	//   { read: true requires: "view_tasks" },
	//   { update: true requires: "edit_tasks"
	//     when: { cmp: { path: ["archived"] op: CMP_OP_EQ
	//       value: { bool_value: false } } } },
	//   { update: true requires: "archive_tasks" }
	// ] }
	// ```
	//
	// A permission held at the workspace root does not skip the check.
	Condition when = 10;
}

// Selects every caller admitted to the workspace as the source of an
// `AccessRule`.
//
// A caller is admitted when the application's workspace hook lets it in. In a
// schema that declares a role, it must also hold at least one permission in
// the workspace.
message AdmittedCaller {}

// Declares an entity whose rows grant roles.
//
// Each row gives the subject in its `subject` field the role in its `role`
// field. The subject is one caller, or every member of a team. The role
// applies at the row's anchor: the row that its `access_parent` field points
// at, or the workspace root when the entity has no `access_parent` field. A
// row grants nothing when its subject is empty or names a team that does not
// exist, its role is not declared in `roles`, or its `access_parent` field is
// unset or names a row that does not exist.
//
// ```protobuf
// message ProjectMember {
//   option (syncplane.v1.entity) = {
//     name: "project_member" key_fields: ["id"]
//     grant: {
//       subject: "user_id" role: "role"
//       roles: [
//         { name: "project_reader" grants: ["view_projects", "view_tasks"] },
//         { name: "project_writer" grants: ["view_projects", "view_tasks",
//         "edit_tasks"] }
//       ]
//     }
//     access: { allow: [
//       { read: true requires: "view_members" },
//       { write: true requires: "manage_members" }
//     ] }
//   };
//   string id = 1;
//   Project project = 2 [(syncplane.v1.field_behavior).access_parent = {}];
//   string user_id = 3;
//   string role = 4;
// }
// ```
//
// To grant to users and to teams from one entity, make the subject a `oneof`:
//
// ```protobuf
//   oneof member {
//     string user_id = 3;
//     Team team = 4;
//   }
// ```
//
// with `subject: "member"`. See `MembersOptions`.
//
// A write that can change what a grant row grants needs every permission of
// the row's role where the row applies: of the stored role at the stored
// anchor, and of the new role at the new anchor. A caller can therefore grant
// and revoke only what it holds itself. Every write path, trusted ones
// included, refuses a grant row with an empty subject, an undeclared role, or
// no `access_parent` on an entity that has one.
//
// Registration refuses unknown fields inside this message and inside `Role`.
message GrantOptions {
	// The name of the field or the `oneof` that holds the subject the row
	// grants to. A field is top-level and singular, and is one of:
	//
	// - a `string` field, which names one subject. The server compares it
	//   with the subjects of the caller.
	// - a reference to an entity that declares `members`, which names a team.
	//   The row grants to every member of that team. The type of the field is
	//   the entity's message, or a reference message without a `workspace`
	//   field.
	//
	// Each member of a `oneof` is one of these, so that one entity can grant
	// to callers and to teams. A row that holds no case grants nothing.
	string subject = 1;
	// The name of a top-level, singular `string` or enum field outside any
	// `oneof` that holds the role the row grants. An enum value names the
	// role with the same name as the value, and every declared role must be a
	// value of the enum.
	string role = 2;
	// The roles that rows of this entity can grant. At least one.
	repeated Role roles = 3;
}

// Declares one role and the permissions it grants.
//
// A role grants the permissions in `grants` and every permission of each role
// in `includes`, through any number of steps:
//
// ```protobuf
// roles: [
//   { name: "task_reader" grants: ["view_projects", "view_tasks"] },
//   { name: "task_writer" includes: ["task_reader"] grants: ["edit_tasks"] }
// ]
// ```
//
// A role grants at least one permission, directly or through `includes`.
message Role {
	// The role name. Unique across the schema, with the same character rules
	// as a permission name.
	string name = 1;
	// The permissions the role grants at its anchor, without duplicates. A
	// permission that an included role also grants is accepted.
	repeated string grants = 2;
	// The names of the roles whose permissions this role also grants, without
	// duplicates. Each one is a role of the same `GrantOptions`. A role that
	// includes itself, directly or through other roles, is refused.
	repeated string includes = 3;
}

// Declares the entity whose rows say who the members of each team are.
//
// A row of the member entity that grants its role at a team row also makes
// its subject a member of that team, whatever the role. A grant row whose
// subject is a reference to a team row grants its role to every member of
// that team. A permission held at the workspace root, or at a row above the
// team, does not make a caller a member.
//
// ```protobuf
// message Team {
//   option (syncplane.v1.entity) = {
//     name: "team" key_fields: ["id"]
//     members: { entity: "team_member" }
//     access: { allow: [
//       { read: true requires: "view_teams" },
//       { write: true requires: "manage_teams" }
//     ] }
//   };
//   string id = 1;
// }
//
// message TeamMember {
//   option (syncplane.v1.entity) = {
//     name: "team_member" key_fields: ["id"]
//     grant: {
//       subject: "user_id" role: "role"
//       roles: [
//         { name: "team_member" grants: ["view_teams"] },
//         { name: "team_lead" grants: ["view_teams", "manage_teams"] }
//       ]
//     }
//     access: { allow: [
//       { read: true requires: "view_teams" },
//       { write: true requires: "manage_teams" }
//     ] }
//   };
//   string id = 1;
//   Team team = 2 [(syncplane.v1.field_behavior).access_parent = {}];
//   string user_id = 3;
//   string role = 4;
// }
// ```
//
// A grant to a team gives its role to whoever a caller adds to the team
// later, so a caller who can write rows of the member entity decides who
// receives it. A write that is not trusted cannot delete a team row while a
// live grant row names it as its subject.
//
// Registration refuses unknown fields inside this message.
message MembersOptions {
	// The name of the entity whose rows make members. It is a grant entity
	// whose `access_parent` field is a reference to this entity and to no
	// other, and whose subject is one `string` field, so a team cannot be a
	// member of a team.
	string entity = 1;
}

// Marks the reference that places each row of an entity below another row in
// the access model.
//
// A permission held at the referenced row applies to the referencing row and
// to every row below it. The referenced row can have an access parent of its
// own, and an entity can be its own access parent.
//
// An entity has at most one access parent: one top-level, singular field, or
// every member of one `oneof` on the entity. Each marked field is a
// reference: its type is an entity message, or a reference message without a
// `workspace` field. A marked field cannot carry a `write_policy`.
//
// A polymorphic parent points at one of several entities: a marked `oneof`,
// or a marked field whose reference message holds a `oneof` of entities. The
// case a row holds names the row it sits below, and a row that holds no case
// has no parent.
//
// Registration refuses unknown fields inside this message.
message AccessParentOptions {}

// Marks a field that records who created the row.
//
// On a create that is not trusted, the server stores the caller's primary
// subject in the field, whatever value the write carries: the first subject
// the server maps the caller to, or an empty value for an anonymous caller.
// After the create, a write that is not trusted cannot change the field: a
// `PATCH` whose mask names it fails, and a `PUT` keeps the stored value. A
// trusted write stores the value it carries.
//
// The field is a top-level, singular `string` field outside any `oneof`. It
// cannot be a key field or carry a `write_policy`.
//
// Registration refuses unknown fields inside this message.
message CreatorOptions {}

// Enables server-side field history tracking for an entity.
//
// When enabled, any `PUT` or `PATCH` operation that changes a field marked
// with `(syncplane.v1.field_behavior).history` records the previous values in
// a `syncplane.v1.FieldHistory` row. You must explicitly mark at least one
// field with history behavior.
//
// The server records changed fields only, not identical writes. Consecutive
// writes to the same row by the same actor within an open session fold into a
// single record holding the state before the first write in the session.
//
// The resulting history entity is `server_only` and does not sync to clients.
// Query history through the `Query` RPC. Deleting a row purges its history
// records.
message HistoryOptions {}

// Specifies which callers can write a specific field of an entity.
//
// Use it when specific fields must be modified only by the server while the
// rest of the row remains client-writable.
//
// The engine handles write operations as follows:
// - A `PATCH` request whose field mask includes a protected field fails.
// - A `PUT` request silently preserves the server value for protected fields
//   (or the zero value for new rows) and applies the remaining fields.
//
// To allow client-initiated changes to protected fields, use a custom mutator
// with appropriate checks and authorize the mutator invocation by name.
// Dynamic per-caller permissions belong in the server `FieldPermissions` hook.
enum FieldWritePolicy {
	// Allows any caller admitted by the permission policy to write the field.
	FIELD_WRITE_POLICY_UNSPECIFIED = 0;
	// Explicitly allows any caller admitted by the permission policy to write
	// the field.
	FIELD_WRITE_POLICY_ALLOW = 1;
	// Only writes made under the engine's Trusted bypass may change the
	// field — a connector, a migration, an effect, a cron job. A PATCH
	// naming the field is refused, while a PUT carries the stored value
	// over and the rest of the write lands. The in-process API is
	// deliberately held to the same policy as a sync client.
	FIELD_WRITE_POLICY_TRUSTED_ONLY = 2;
}

// Declares a message as a reference message: the stored shape of a typed
// reference that can cross workspace boundaries.
//
// A field whose message type is an entity is already a reference, and it
// resolves inside the holder's workspace because a stored stub carries
// only the target's key fields. A reference message wraps that stub
// together with the workspace it lives in:
//
// ```protobuf
// message PersonRef {
//   option (syncplane.v1.reference) = {};
//   string workspace_id = 1 [(syncplane.v1.field_behavior).workspace = true];
//   Person person = 2;
// }
// message Task {
//   PersonRef assignee = 2;
//   repeated PersonRef watchers = 3;
// }
// ```
//
// A field of a reference message type is a reference like any other: it
// gets the forward accessor, the reverse relation on the target, the
// follow segment, and the derived index, and its target is the entity the
// embedded field names. The message holds the entity field (or the oneof
// of entity fields) and the workspace field and nothing else; any other
// field is rejected at registration. Specifically, it must carry exactly
// one singular entity-typed field — or a oneof whose members are all
// singular entity-typed fields, making it a polymorphic reference — and
// at most one string field marked
// `(syncplane.v1.field_behavior).workspace` outside any oneof. An empty or
// unset workspace value means the holder's own workspace, so a reference
// message without the workspace field is a same-workspace reference with
// an explicit stored shape.
//
// ```protobuf
// message OwnerRef {
//   option (syncplane.v1.reference) = {};
//   string workspace_id = 1 [(syncplane.v1.field_behavior).workspace = true];
//   oneof owner {
//     Person person = 2;
//     Team team = 3;
//   }
// }
// ```
//
// Each member of the oneof is a case with its own reverse relation on its
// target and its own derived index that a query names as `owner.person`,
// and a stored value holds at most one case. A oneof of references on the
// holder itself is polymorphic too, named by the oneof; its members may be
// entity-typed fields, reference messages, and plain fields alike, where
// only the references are cases.
//
// A reference message is replaced whole on every write: a PATCH mask that
// names one names the whole message, so the workspace and the key never
// split. A repeated reference message merges as a set whose elements are
// identified by workspace and key and case together, so a PATCH adds or
// removes one element without touching the others. An element naming no
// workspace and one naming the holder's own workspace are two elements,
// even though they resolve to the same row.
//
// Reading is client-local: a client resolves each stub in the workspace it
// names, from the workspaces it holds. The server evaluates `matches()`,
// `include`, and `follow` inside the request's workspace only, so a stub
// that names another workspace resolves to nothing there.
message ReferenceOptions {}

// Specifies a single field read during full-text search.
message SearchField {
	// The dotted field path to a singular string or collaborative text field,
	// for example `"title"` or `"details.summary"`.
	//
	// Collaborative text fields are searched as their plain-text value.
	string path = 1;
}

// Configures full-text search over an entity, specifying searchable fields in
// order of importance and text analysis settings.
//
// Fields are evaluated in the order listed, with earlier fields ranked higher
// during relevance scoring.
//
// Text analysis applies Unicode normalization, lowercasing, diacritic folding
// (unless `keep_diacritics` is `true`), and segmentation with CJK bigrams to
// both content and search queries.
//
// Search matching behaves identically locally and on the server, returning
// identical rows and sort order with or without a search index.
message SearchSpec {
	// The fields to search, ordered from most important to least important.
	//
	// Fields marked with `(syncplane.v1.field_behavior).searchable` are
	// evaluated before the fields listed here. A field path may appear only
	// once across both definitions.
	repeated SearchField field = 1;
	// Preserves diacritical marks during text analysis.
	//
	// When `true`, words such as "café" and "cafe" analyze to distinct terms.
	// Defaults to `false`, which folds diacritics together.
	bool keep_diacritics = 2;
}

// Specifies one field component of an index and its sort order.
message IndexKey {
	// The dotted field path for this index component, for example
	// `"settings.size"`.
	//
	// A path ending at a single-key reference extends to that reference's key
	// field.
	string path = 1;
	// Sorts this index component in descending order.
	//
	// When `false`, sorts ascending. Missing and `NaN` values always sort last
	// regardless of this setting.
	bool desc = 2;
}

// Defines a secondary index for an entity.
message IndexSpec {
	// The index name, unique within the entity.
	//
	// Names beginning with `__` are reserved for engine-derived indexes.
	string name = 1;
	// The ordered key components that make up the index.
	//
	// A query can use this index when its equality filters match a prefix of
	// these components and its sort order matches the subsequent components.
	repeated IndexKey key = 2;
}

// Configures merge, indexing, and authorization behavior for a field.
message FieldBehavior {
	// Specifies that the field is replaced as a whole value rather than merged
	// structurally.
	//
	// Use this for Conflict-free Replicated Data Type (CRDT) blobs or any list
	// or field that must be treated as a single atomic value, such as
	// order-sensitive or duplicate-bearing lists.
	bool opaque = 1;
	// Specifies the identity field names for elements in a list of messages.
	//
	// Supports composite keys. When empty and the element type is a registered
	// entity, defaults to `EntityOptions.key_fields`. Ignored for maps (which
	// are keyed by map key) and scalar lists (which are keyed by value).
	repeated string key_field = 2;
	// Names the position field on list elements used to order a keyed list.
	//
	// The framework manages this field as a fractional index to support
	// movable list elements. Requires a keyed message list.
	string order_field = 3;
	// Specifies that the field stores collaborative text with convergent
	// editing, marks, and anchors.
	//
	// Requires a singular `bytes` field and implies `opaque = true`. The
	// engine automatically merges concurrent `PATCH` operations without
	// interleaving characters. Incompatible with `key_field` and
	// `order_field`.
	//
	// The field path may traverse keyed message lists and message-valued maps,
	// giving each element its own document. This option cannot be used inside
	// a `oneof` or an unkeyed repeated element.
	bool text = 4;
	// Maintains a single-field secondary index over this field to speed up
	// filtering and ordering.
	//
	// To filter by one field and order by a different field, declare an index
	// in `EntityOptions.index` instead. This option is not supported on
	// collaborative text fields; use `SearchSpec` for text search.
	bool indexed = 5;
	// Includes this field in append-only history tracking.
	//
	// Key fields are never recorded in a history row's mask however they
	// are marked, because a PATCH may not change one and a restore built
	// from a mask naming one would be refused. The prior value still
	// carries them, so a decoded history entry always says which row it
	// belongs to. Marking any member of a `oneof` tracks the entire
	// `oneof` group. Ignored if the entity does not enable
	// `EntityOptions.history`.
	bool history = 6;
	// Includes this field in full-text search.
	//
	// Fields marked with this option are evaluated before fields listed in
	// `EntityOptions.search`, in field declaration order. Requires a singular
	// string or collaborative text field. See `SearchSpec`.
	bool searchable = 7;
	// Specifies who can write this field.
	//
	// When unset, any caller admitted by the application permission policy can
	// write the field.
	//
	// Apply this option to top-level fields only. Protecting a message field
	// protects all fields within it. Marking any member of a `oneof` protects
	// the entire `oneof` group. Key fields cannot be marked with a write
	// policy. See `FieldWritePolicy`.
	FieldWritePolicy write_policy = 8;
	// Identifies the workspace field within a reference message.
	//
	// Marks a singular string field in a message with
	// `(syncplane.v1.reference)` that stores the target workspace identifier.
	// An empty value defaults to the holder's workspace. Each reference
	// message can contain at most one workspace field. See `ReferenceOptions`.
	bool workspace = 9;
	// Names the reverse relation that this reference adds to its target
	// entity.
	//
	// The reverse relation lists the rows of this entity that point at one
	// target row. A `follow` segment, an `include` key and the client's
	// `refs` accessor on the target entity use its name. When empty, the
	// name is the plural of this entity's name and this field's name in
	// camelCase, joined by `By`: `issuesByAssignee` for the `assignee`
	// field of the `issue` entity. The name never depends on other fields,
	// so adding a reference does not rename an existing one.
	//
	// Two reverse relations on one target entity must have different
	// names, and a name must not be the name of a reference field of the
	// target. On a clash, the client refuses the schema when it starts and
	// the server refuses each request that follows a relation.
	//
	// The name must start with a letter or an underscore, followed by
	// letters, digits and underscores. Valid only on a reference field
	// declared directly on an entity, including a member of a `oneof`. A
	// field that holds a polymorphic reference message gives its name to
	// the reverse relation of every case.
	string reverse_relation = 10;
	// Places each row below the row that this reference points at in the
	// access model. See `AccessParentOptions`.
	AccessParentOptions access_parent = 11;
	// Stores the subject of the caller who creates the row. See
	// `CreatorOptions`.
	CreatorOptions creator = 12;
}

extend google.protobuf.MessageOptions {
	// Field numbers 50100, 50101 and 50102 are unregistered; fine for
	// internal use.
	EntityOptions entity = 50100;
	// Message option that configures reference message options for
	// cross-workspace references.
	ReferenceOptions reference = 50102;
}

extend google.protobuf.FieldOptions {
	// Field option that configures field-level merge, indexing, and
	// authorization behavior.
	FieldBehavior field_behavior = 50101;
}
