syntax = "proto3";

package syncplane.v1;

import "syncplane/v1/mutation.proto";
import "syncplane/v1/patch.proto";
import "syncplane/v1/query.proto";

option go_package = "github.com/levelfourab/syncplane/engine/gen/syncplane/v1;syncplanev1";

// SyncService uses only the browser-safe ConnectRPC subset: unary and
// server-streaming RPCs. Subscribe is a server-streaming RPC (Connect framing
// over fetch), not literal SSE.
//
// Workspace multiplicity is split deliberately. `workspace_id` is the hard
// partition key — sequences, cursors, write exclusion and the access gate are
// all per workspace — but a client commonly holds SEVERAL workspaces at once,
// and the browser's per-host connection budget is spent by long-lived streams,
// not by unary calls. So the two RPCs that carry real cost across workspaces
// take a set:
//
//   - Subscribe carries N workspace scopes on ONE stream, so a client's
//     connection count is independent of how many workspaces it syncs.
//   - Push carries N per-workspace batches in one round trip. Each batch still
//     commits in its own write transaction against its own partition; there is
//     no cross-workspace atomicity and none is implied.
//
// Bootstrap and Query stay single-workspace: bootstrap is a discrete,
// transient event per workspace, and a query is by construction one predicate
// against one partition. Pull likewise stays single-workspace — it is the
// fallback path when no stream is held, and it is cheap to issue in parallel.
service SyncService {
	// Push applies batches of client mutations, one write transaction per
	// workspace. Business rejections are MutationResults, not RPC errors, and a
	// failure scoped to one workspace (a mutation-id gap, a revoked workspace)
	// is reported in that workspace's results rather than failing the request.
	rpc Push(PushRequest) returns (PushResponse);
	// Pull returns row changes for one workspace since the given cursor.
	rpc Pull(PullRequest) returns (PullResponse);
	// Bootstrap streams a full snapshot of one workspace: Begin, Chunk*, End.
	rpc Bootstrap(BootstrapRequest) returns (stream BootstrapResponse);
	// Subscribe is "a Pull that never closes", multiplexed over a set of
	// workspaces. It catches each scope up from its cursor, then pushes changed
	// rows down the stream as those workspaces change, so an already-subscribed
	// client applies them directly and skips the follow-up Pull RTT. Every
	// frame names the workspace it concerns. Subscribe carries payload and must
	// never silently drop a patch.
	//
	// The scope set is fixed for the life of the stream — adding a workspace,
	// removing one, or changing a subscription set is a close + reopen, since
	// the browser ConnectRPC subset has no bidi channel for an in-band control
	// message. Clients reconnect with backoff and fall back to Pull + polling.
	rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
	// Query runs a one-shot predicate query against current server state —
	// for data outside the synced subset. Results are snapshots: they are not
	// merged with local optimistic state and not stored. A declared secondary
	// index serves the query when one covers its predicate and ordering;
	// without one it scans and decodes every visible row of the entity per
	// request, O(entity) in time regardless of limit. Memory is bounded to the
	// page; prefer a selective predicate over deep pagination, and page with
	// after/before rather than offset.
	rpc Query(QueryRequest) returns (QueryResponse);
}

// WorkspaceBatch is one workspace's slice of a push. Mutation ids are per
// (workspace, caller, client_id): the server keeps one watermark for each, and
// the contiguity rule (id == watermark+1) applies within a batch, never across
// batches. A client holding several workspaces therefore keeps a separate
// mutation-id counter and pending queue per workspace.
//
// The caller is the authenticated principal, by issuer and subject. Every
// anonymous caller counts as one caller. A push from another caller under the
// same client_id does not move this caller's watermark, and Pull, Bootstrap
// and Subscribe report each caller its own.
message WorkspaceBatch {
	string workspace_id = 1;
	repeated Mutation mutations = 2;
}

message PushRequest {
	// One batch per workspace. Batches are independent: each is gated,
	// authorized and committed on its own, and the order they are applied in is
	// unspecified. Two batches naming the same workspace are rejected.
	repeated WorkspaceBatch batches = 1;
}

enum MutationStatus {
	MUTATION_STATUS_UNSPECIFIED = 0;
	MUTATION_STATUS_APPLIED = 1;
	// Mutation id at or below the server's watermark for this client; safe to
	// drop (idempotent retry).
	MUTATION_STATUS_ALREADY_APPLIED = 2;
	// Business rejection. This is an ack: the client drops the mutation and
	// fires its rejection callback.
	MUTATION_STATUS_REJECTED = 3;
}

message MutationResult {
	uint64 mutation_id = 1;
	MutationStatus status = 2;
	// Workspace sequence assigned when status is APPLIED; 0 otherwise. This is
	// the only in-band way a writer learns the sequence its own write took,
	// without waiting for the row to come back down a pull as
	// RowChange.version. A REJECTED mutation reports 0 because it consumes no
	// sequence — its savepoint rolled back — which is what makes rejections
	// free rather than gap-producing.
	//
	// The TypeScript client tracks the highest value per workspace and sends
	// it back as PullRequest.min_seq / WorkspaceScope.min_seq, so a
	// replica-reading server never serves it a snapshot older than its own
	// acked writes. Also the only in-band way a client that never syncs back —
	// a server-side or batch writer — learns the sequence its write took.
	uint64 seq = 3;
	// Machine-readable rejection code (e.g. "permission_denied").
	string error_code = 4;
	string error_message = 5;
}

// WorkspaceResults reports the outcome of one WorkspaceBatch.
//
// A batch can fail as a whole — a mutation-id gap, a revoked workspace, a
// storage failure — without saying anything about the other workspaces in the
// same request. That failure is reported HERE, as error_code/error_message with
// empty results, instead of as an RPC error, so one bad partition cannot wedge
// the push path for every other workspace the client holds. RPC errors remain
// reserved for failures of the request itself (malformed, over limits,
// unauthenticated).
message WorkspaceResults {
	string workspace_id = 1;
	// One result per mutation in the batch, in submission order. Empty when
	// error_code is set.
	repeated MutationResult results = 2;
	// Set when the whole batch failed. Codes: "mutation_id_gap" (resend in
	// order from the client's watermark), "workspace_access_revoked"
	// (permanent — stop syncing this workspace, see the client's purge path),
	// "invalid_argument" (deterministic; the batch will never apply),
	// "internal" (transient; retry).
	string error_code = 3;
	string error_message = 4;
}

message PushResponse {
	// One entry per submitted batch, in request order.
	repeated WorkspaceResults results = 1;
	// The server's app-defined schema revision; see
	// PullResponse.schema_revision. Carried here too so a client learns of skew
	// on the WRITE path — the sync cycle pushes before it pulls, so without
	// this the first cycle after a deploy always pushes against a skewed server
	// before a "block" policy can engage.
	string schema_revision = 2;
}

message PullRequest {
	string workspace_id = 1;
	string client_id = 2;
	// Opaque cursor from a previous Pull/Bootstrap/Subscribe. Empty means "from
	// the beginning", which the server serves only while the workspace has
	// collected no tombstones; once it has, an empty cursor is below the
	// collection horizon like any other stale cursor and answers reset=true.
	// Clients with no state should therefore Bootstrap: replaying from the
	// beginning is not a substitute for it and stops working without warning.
	bytes cursor = 3;
	// Scopes the sync. Empty = full sync. A mismatch with the subscription
	// set the cursor was issued under starts a delta resync: only the
	// visible-set difference ships (values in, tombstones/drops out). When the
	// old set cannot be reconstructed the server replies reset=true instead.
	repeated Subscription subscriptions = 4;
	// Maximum number of changes to return. 0 means "server default"; the
	// server clamps to its own maximum either way. When the response is
	// truncated, has_more is set and next_cursor resumes the scan.
	uint32 limit = 5;
	// Entities whose rows this client stores but cannot decode, and so cannot
	// fold delta state into. Their rows ship as full snapshots and are never
	// named in RowChange.text_deltas. Empty means the client can reconstruct
	// every entity it stores.
	//
	// Delta state assumes the recipient both holds the row as of its cursor and
	// can read it, and the server can only judge the first. A client that
	// stores rows for an entity outside its own schema — one build keeping
	// another build's rows current in a shared local store — names it here, or
	// discards and re-bootstraps on every page that carries delta state for it.
	repeated string no_delta_entities = 6;
	// Lowest workspace sequence this pull may be answered from: the highest
	// seq the client has seen a push acked at (MutationResult.seq). A freshness
	// floor for servers reading from a replica — without it, a pull served
	// from a snapshot older than the client's own acked writes would drop
	// their optimistic state and briefly revert them. It never widens what the
	// pull returns; the cursor still decides that. 0 (and clients predating
	// the field) means no floor beyond the cursor's own position.
	uint64 min_seq = 7;
	// The CallerAccess.version of the summary the client holds for the
	// workspace, 0 when it holds none. A client that sets the field can apply
	// a CallerAccessDelta, and the response carries one only when it applies
	// to this version. Without the field, the response carries a whole
	// CallerAccess when the cursor was issued under another one.
	optional fixed64 caller_access_version = 8;
}

message PullResponse {
	Patch patch = 1;
	// Where to resume. A Pull response always carries one. A Subscribe page
	// frame carries one only at a checkpoint when the client set
	// sparse_cursor: empty then means "keep the cursor you hold", and the
	// frames since the last checkpoint are re-delivered if the stream is
	// reopened. Empty is never a valid cursor to store.
	bytes next_cursor = 2;
	// Highest mutation id the server has applied for this client and caller
	// (see WorkspaceBatch); the client drops pending mutations at or below it
	// during rebase.
	uint64 last_acked_mutation_id = 3;
	// True when the client must discard local state and re-bootstrap: the
	// cursor predates the tombstone horizon, or its scope changed in a way the
	// server cannot delta-resync (old subscriptions unknown, filter epoch not
	// reconstructable, or another change landed mid-resync). On Subscribe the
	// same condition arrives as a WorkspaceDropped frame instead.
	bool reset = 4;
	// True when the response was truncated by the limit; pull again from
	// next_cursor to continue.
	bool has_more = 5;
	// Workspace sequence this response is current through (the position
	// next_cursor encodes). Lets clients judge how far behind they are without
	// decoding the opaque cursor. Unset when reset is true.
	uint64 seq = 6;
	// The server's app-defined schema revision (see WithSchemaRevision). Empty
	// when the server advertises none (an older build, or the option unset). A
	// client configured with its own revision compares the two and reacts to a
	// mismatch per its skew policy.
	string schema_revision = 7;
	// What the caller holds in the workspace under the access model. Present
	// when it differs from what the request's cursor was issued under, and on
	// a response to a request without a cursor. Absent otherwise, and in a
	// schema without the access model: the client keeps the last one it
	// received.
	CallerAccess caller_access = 8;
	// A change to the CallerAccess that PullRequest.caller_access_version
	// names, in place of caller_access. At most one of the two is present,
	// and only a request that sets caller_access_version receives this one.
	CallerAccessDelta caller_access_delta = 9;
}

// What one caller holds in one workspace under the access model: the
// permissions it holds at the workspace root, and the rows it holds
// permissions at, grouped by the permissions held there.
//
// The caller holds a permission at a row when root_permissions lists it, or
// when the anchor group that lists the row lists it. A permission held at a
// row applies to the row and to every row whose access parent points at it.
// A permission that no list names is held nowhere.
//
// Every list except subjects is sorted and holds no duplicates, so equal
// access has one encoding, apart from seq and version.
//
// It is advisory. The server decides every read and every write itself, and a
// client uses this to predict an answer, for example to hide a control the
// caller cannot use.
message CallerAccess {
	// The workspace sequence this summary is current through.
	uint64 seq = 2;
	// The caller's subjects: the values grant rows and `subject` checks
	// compare with. The first is the primary subject, which a create stores
	// in each `creator` field. Empty for an anonymous caller.
	repeated string subjects = 3;
	// The permissions the caller holds at the workspace root, which covers
	// every row. Sorted.
	repeated string root_permissions = 4;
	// One group for each distinct set of permissions the caller holds at rows,
	// sorted by permission list: compared element by element, with a list
	// before the longer lists it begins. A row is in at most one group, which
	// lists all the permissions the caller's grants at the row give together.
	repeated AnchorGroup anchor_groups = 5;
	// Identifies what the summary holds: equal summaries have equal versions,
	// whatever their seq. Never 0 in a summary from the server.
	fixed64 version = 6;
	// The most access parent hops the server follows up from a row: its
	// MaxAccessDepth. A permission held at a row further up does not apply to
	// the row. 0 from a server that does not send it, and a client then
	// assumes 32, the default.
	uint32 max_access_depth = 7;
}

// A change to a CallerAccess: applied to the summary whose version is
// base_version, it gives the summary whose version is version. Subjects,
// root_permissions and max_access_depth do not change.
//
// To apply it, put each row that anchor_groups lists in the group with the
// permissions listed there, and take it out of the group it was in. Then
// take each row that removed lists out of every group, and drop the groups
// that hold no rows. A client whose summary has another version must not
// apply it: when its summary already has version, the delta changes nothing,
// and otherwise the client keeps its summary and pulls again with
// PullRequest.caller_access_version, which gets it the change from there.
message CallerAccessDelta {
	// The workspace sequence the new summary is current through.
	uint64 seq = 1;
	// The version of the summary the delta applies to.
	fixed64 base_version = 2;
	// The version of the summary the delta gives.
	fixed64 version = 3;
	// The rows whose permissions changed, and rows the caller holds
	// permissions at for the first time, each with all the permissions it now
	// holds there. Ordered and grouped as in CallerAccess.anchor_groups.
	repeated AnchorGroup anchor_groups = 4;
	// The rows that are in no group of the new summary. Sorted by entity.
	repeated AnchorRows removed = 5;
}

// Rows at which the caller holds the same set of permissions.
message AnchorGroup {
	// The permissions held at each row of the group. Sorted and never empty.
	// It leaves out the permissions in CallerAccess.root_permissions, so a row
	// whose permissions are all held at the root is in no group.
	repeated string permissions = 1;
	// The rows, per entity, sorted by entity.
	repeated AnchorRows anchors = 2;
}

// Rows of one entity, by key.
message AnchorRows {
	string entity = 1;
	// Row keys, sorted.
	repeated string keys = 2;
}

message BootstrapRequest {
	string workspace_id = 1;
	string client_id = 2;
	// Scopes the snapshot. Empty = full sync.
	repeated Subscription subscriptions = 3;
	// Entities to ship BEFORE the rest, in this order — what the client needs
	// on screen first. A snapshot is delivered entity by entity and a cold
	// client can read each one as it lands, so the order decides what the user
	// looks at while the rest downloads. Names not in scope (unregistered, or
	// unsubscribed under `subscriptions`) are ignored; anything unnamed follows
	// in the server's own order. Without it a subscribed client is served in
	// subscription order and a full-sync client in the server's entity order.
	repeated string priority_entities = 4;
	// Continues an interrupted snapshot instead of starting a new one. The
	// server decides whether it can honour it — a changed subscription set, a
	// cursor that has fallen behind the tombstone horizon, or a different store
	// all mean a fresh snapshot, reported back as Begin.resumed = false.
	BootstrapResume resume = 5;
}

// BootstrapResume names an interrupted snapshot and how far it got, so the next
// attempt continues that snapshot rather than downloading it again. Both fields
// are opaque to clients: they are stored and echoed back exactly as received.
message BootstrapResume {
	// The Begin cursor of the interrupted attempt. It identifies WHICH snapshot
	// is being continued: the server keeps serving that one and re-issues this
	// same cursor on the resumed Begin, so the follow-up Pull still covers
	// everything written since it was minted — including rows the earlier
	// attempt already delivered.
	bytes cursor = 1;
	// Scan position from the last Chunk the client durably stored
	// (Chunk.resume_token). Carried apart from the cursor because it rides on
	// every chunk while the cursor does not: a windowed or following cursor
	// holds a bounded key-set that would otherwise be repeated once per chunk.
	bytes token = 2;
}

message BootstrapResponse {
	message Begin {
		// Cursor capturing the snapshot position; pass to the next Pull.
		bytes cursor = 1;
		uint64 last_acked_mutation_id = 2;
		// Workspace sequence the cursor captures; see PullResponse.seq.
		uint64 seq = 3;
		// The server's schema revision at snapshot time.
		string schema_revision = 4;
		// Every entity this snapshot ships rows for, in delivery order. Rows of
		// one entity arrive contiguously, so a client reading a row of
		// entities[i] knows entities[0..i) shipped in full — which is what lets
		// a progressively-applied snapshot say which entities are still
		// arriving and which are already whole. An entity with no matching rows
		// is still listed (it completes silently when the next one starts).
		repeated string entities = 5;
		// True when the request's `resume` was honoured: the chunks that follow
		// are the REST of that snapshot, and `cursor` is the one it began with.
		// False means a fresh snapshot — whatever an earlier attempt staged
		// belongs to a different one and must be discarded rather than merged.
		bool resumed = 6;
		// What the caller holds in the workspace under the access model, as of
		// the snapshot. Absent in a schema without the access model.
		CallerAccess caller_access = 7;
	}
	message Chunk {
		repeated RowChange rows = 1;
		// Scan position covering every row delivered through this chunk. A
		// client that durably stores the chunk stores this alongside it and
		// hands it back in BootstrapResume.token to continue from here. Empty
		// from servers that cannot resume, which simply means the next attempt
		// starts the snapshot over.
		bytes resume_token = 2;
	}
	message End {}

	oneof body {
		Begin begin = 1;
		Chunk chunk = 2;
		End end = 3;
	}
}

message QueryRequest {
	string workspace_id = 1;
	// Entity name as declared via EntityOptions.
	string entity = 3;
	// Absent = all rows (read filters still apply).
	Condition predicate = 4;
	repeated OrderKey order_by = 5;
	// Maximum rows to return. 0 means "server default"; the server clamps to
	// its own maximum either way.
	uint32 limit = 6;
	// Rows to skip after ordering. The server retains offset+limit rows in
	// memory, so offsets beyond the server's maximum are rejected (not clamped:
	// a clamp would silently return the wrong page).
	//
	// It is the way to jump to an arbitrary rank, which `after`/`before` cannot
	// do; for walking pages in sequence those are cheaper and stable, and
	// setting an offset alongside either is rejected.
	uint32 offset = 7;
	// Exclusive lower bound: only rows sorting strictly after this position are
	// returned. Opaque bytes from a prior QueryResponse of the SAME query — its
	// end_cursor to step forward, its start_cursor to bound the page below.
	//
	// A cursor is tied to the (entity, order_by) pair it was issued under; one
	// replayed against a different entity or ordering is INVALID_ARGUMENT, as
	// is one sent alongside a non-zero offset. `limit` counts forward from this
	// bound.
	bytes after = 8;
	// Exclusive upper bound: only rows sorting strictly before this position
	// are returned. Same rules as `after`.
	//
	// With `before` alone, `limit` counts BACKWARD from this bound, so passing
	// a page's start_cursor returns the page preceding it. With both bounds set
	// the request reads a bounded range and `limit` counts forward from
	// `after`. Rows always come back in order_by order whichever bounds are
	// set.
	bytes before = 9;
	// Answer with GROUPS of the match set rather than with its rows: the rows
	// are partitioned by the value at this path, and `aggregate` says what to
	// compute for each partition. Absent = an ordinary row query.
	//
	// Groups come back in ascending value order with the no-value group last —
	// the order an ascending `order_by` on the same path puts rows in — and
	// `limit` caps how many are returned. The other paging fields describe a
	// page of rows and have no counterpart here, so `offset`, `after` and
	// `before` are rejected alongside it, as is `order_by` under an aggregate
	// that answers with numbers: only AGGREGATE_OP_ROWS has rows to order.
	//
	// A path through a REPEATED field groups per ELEMENT: a row holding three
	// labels joins three groups, so the counts do not sum to the number of
	// matching rows. That is what a label facet wants and what a row count is
	// not.
	//
	// Only groups the match set produces exist. A status no row currently holds
	// is absent rather than zero — the set of possible values is the caller's
	// schema, not something a read over rows can recover.
	repeated string group_by = 10;
	// What to compute per group. Required with `group_by`, rejected without it.
	AggregateOp aggregate = 11;
	// Rows to return per group under AGGREGATE_OP_ROWS, counted from the first
	// in `order_by` order. Required there and rejected under every other
	// aggregate.
	//
	// The response carries `limit` × `per_group` rows, so both are clamped
	// against the row maximum an ungrouped page is clamped to: a request asking
	// for more groups than that leaves room for gets the first of them, with
	// has_more set.
	uint32 per_group = 12;
	// Whether each row group reports how many rows it holds in all. It costs a
	// walk of every matching row of every returned group, where the rows
	// themselves cost `per_group` of them — so a caller that shows no count
	// leaves it false. Ignored without AGGREGATE_OP_ROWS.
	bool per_group_total = 13;
	// Per-value counts of the match set, computed in the walk that answers the
	// rows: one QueryFacet per axis, each naming a path, answered in
	// QueryResponse.facets in the same order. A facet counts every row the
	// predicate and the cursor bounds admit — the rows `rows` was cut from, not
	// the page — so its counts sum to what the page's `total` would be, except
	// on a repeated path, which counts per element (see group_by).
	//
	// Facets force the walk over every matching row rather than the page, so
	// a request carrying one costs what an unlimited read of the predicate
	// costs; the response stays a page. Rejected alongside group_by — a
	// grouped read answers with groups already — and capped by the server's
	// MaxQueryFacets.
	repeated QueryFacet facets = 14;

	// Was client_id. Query is a read: it carries no idempotency and no
	// watermark, and read filters key on workspace and entity, so the server
	// never had a use for it.
	reserved 2;
	reserved "client_id";
}

message QueryResponse {
	// Value changes only (never tombstones), ordered by order_by with ties
	// broken by row key ascending.
	repeated RowChange rows = 1;
	// The server's schema revision; see PullResponse.schema_revision. A query
	// answered by a skewed server is otherwise undetectable.
	string schema_revision = 2;
	// Positions of the first and last returned row, for paging on. Send
	// end_cursor as `after` for the next page, start_cursor as `before` for the
	// previous one. Both are empty when the page is.
	//
	// There is no has_previous: under `after` it is "the request had one",
	// which the caller already knows.
	bytes start_cursor = 3;
	bytes end_cursor = 4;
	// Whether rows remain past the end `limit` counted from — after end_cursor
	// for a forward page, before start_cursor for a backward one. False for an
	// unlimited query, which returns everything that matched. Under `group_by`
	// it reports whether groups remain past `limit` instead.
	bool has_more = 5;
	// The groups of a request carrying `group_by` with a counting aggregate, in
	// ascending value order with the no-value group last; empty otherwise.
	// `rows`, `start_cursor` and `end_cursor` are all empty whenever a request
	// grouped.
	repeated QueryGroup groups = 6;
	// The groups of a request carrying `group_by` with AGGREGATE_OP_ROWS, in
	// the same order; empty otherwise.
	repeated QueryRowGroup row_groups = 7;
	// The facets of a request carrying `facets`, one per requested axis in
	// request order, each echoing its path; empty otherwise.
	repeated QueryFacet facets = 8;
}

// QueryRowGroup is one group of a read that answers with rows: the value its
// rows share at the grouping path, and the first of them in order_by order.
message QueryRowGroup {
	// The shared value, absent for the group of rows that hold no value at the
	// path — a group of its own, ordered last.
	QueryValue value = 1;
	// The group's first rows, at most QueryRequest.per_group of them, ordered
	// by order_by with ties broken by row key ascending. Value changes only,
	// never tombstones.
	repeated RowChange rows = 2;
	// Matching rows in the group in all, or 0 when the request did not ask for
	// it — a group that holds no matching row does not come back at all, so 0
	// never means "empty".
	uint64 total = 3;
	// Whether the group holds rows past the ones returned.
	bool has_more = 4;
}

// WorkspaceScope is one workspace's slice of a Subscribe stream: where to
// resume from and what to sync. The subscription set is fixed for the life of
// the stream. A cursor issued under another subscription set or filter epoch
// delta-resyncs on the stream before the scope reports caught_up, and a filter
// epoch that moves while the stream is open delta-resyncs the scope then, both
// exactly as a Pull would. Where a Pull would reset, the scope is dropped with
// reason RESET.
message WorkspaceScope {
	string workspace_id = 1;
	// Opaque cursor from a previous Pull/Bootstrap/Subscribe. Empty means "from
	// the beginning", under the same bound as PullRequest.cursor: a workspace
	// that has collected tombstones drops the scope with reason RESET instead.
	bytes cursor = 2;
	// Scopes this workspace's stream. Empty = full sync.
	repeated Subscription subscriptions = 3;
	// PullRequest.min_seq, applied to every page this scope is served: the
	// highest seq the client has seen a push acked at for this workspace.
	uint64 min_seq = 4;
	// PullRequest.caller_access_version, for the first page of this scope. A
	// later page sends what changed since the CallerAccess or delta the scope
	// sent last.
	optional fixed64 caller_access_version = 5;
}

message SubscribeRequest {
	// Idempotency handle, shared by every scope: watermarks are kept per
	// (workspace, caller, client_id) (see WorkspaceBatch), so one handle per
	// client is enough and lets each page report last_acked_mutation_id for its
	// own workspace.
	string client_id = 1;
	// The workspaces this stream carries. At least one; duplicates are
	// rejected, and the server caps the count (see Limits).
	repeated WorkspaceScope scopes = 2;
	// Catch-up page size, applied per workspace. 0 means "server default"; the
	// server clamps to its own maximum either way. Pages stream back-to-back
	// until each scope is drained.
	uint32 limit = 3;
	// PullRequest.no_delta_entities, applied to every scope: what a client can
	// decode is a property of its build, not of one workspace.
	repeated string no_delta_entities = 4;
	// True when the client can apply a page frame that carries no next_cursor,
	// keeping the cursor it already holds. The server then sends the cursor as
	// a periodic checkpoint instead of on every frame.
	//
	// It is worth setting for a windowed or reference-following subscription,
	// whose cursor carries the client's whole membership set and so is orders
	// of magnitude larger than the page it rides on. The cost is that a
	// reopened stream resumes from the last checkpoint rather than the last
	// frame, re-delivering what came after it; the server withholds a cursor
	// only while that re-delivery would cost less than the cursor it skipped.
	bool sparse_cursor = 5;
}

// WorkspaceDropped ends one workspace's participation in a stream. The server
// sends nothing further for that workspace; every other scope keeps streaming.
// The client acts on the reason and reopens the stream when it has a usable
// scope set again.
message WorkspaceDropped {
	enum Reason {
		REASON_UNSPECIFIED = 0;
		// The cursor is unusable: it predates the tombstone horizon, its scope
		// cannot be delta-resynced, or it was issued by a different store
		// lineage. Re-bootstrap this workspace, then reopen the stream.
		REASON_RESET = 1;
		// The workspace-access gate refused this caller, permanently. Stop
		// syncing the workspace and discard the local copy; retrying will not
		// change the answer.
		REASON_ACCESS_REVOKED = 2;
		// A failure scoped to this workspace that may not persist (storage
		// error, a permission hook that could not decide). Reopen with backoff.
		REASON_ERROR = 3;
		// The caller holds no permission in the workspace's access model. A
		// grant written later lifts it, so keep the local copy and the queue,
		// and retry with backoff.
		REASON_NO_ACCESS = 4;
	}
	Reason reason = 1;
	// Human-readable detail for logs. Never parse it; branch on reason.
	string message = 2;
}

// SubscribeResponse is one frame of the stream, always naming the workspace it
// concerns — except a heartbeat, which is stream-level.
message SubscribeResponse {
	// The workspace this frame is about. Empty only on a heartbeat.
	string workspace_id = 1;
	// The server's app-defined schema revision, carried on EVERY frame
	// (including heartbeats) so a connected client learns of a rolling deploy
	// without waiting for its next page. Empty when the server advertises none.
	string schema_revision = 2;

	oneof body {
		// One forward page for workspace_id: patch / next_cursor /
		// last_acked_mutation_id / has_more / seq, identical to a Pull
		// response. `reset` is never set here — that arrives as a dropped
		// frame, so it can end one workspace without ending the stream.
		PullResponse page = 3;
		// Sent once per workspace, after its catch-up backlog drains: that
		// workspace is now current and its live tail follows. Other scopes may
		// still be catching up.
		bool caught_up = 4;
		// This workspace has left the stream; see WorkspaceDropped.
		WorkspaceDropped dropped = 5;
		// Liveness keepalive for the whole stream. Carries no workspace and no
		// page, so the client treats it as a no-op (no rebase, no notify) — it
		// only proves the connection is still warm.
		bool heartbeat = 6;
	}
}
