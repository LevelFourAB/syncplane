syntax = "proto3";

package syncplane.v1;

import "syncplane/v1/query.proto";

option go_package = "github.com/levelfourab/syncplane/engine/gen/syncplane/v1;syncplanev1";

// FieldDelta carries one collaborative-text document of a RowChange as delta
// state instead of as part of the row snapshot. `field` is the document's
// dotted path: the proto path for a field on a singular chain, with the
// element key inserted where the path crosses a keyed message list or map
// ("notes.<key>.body") — the same form a PATCH field mask addresses the
// document by, one entry per element.
//
// `fragment` is a text delta-state fragment (format version 0x02) to apply to
// the field's CONFIRMED bytes; empty means the field did not change over the
// span and the recipient keeps what it already holds. Either way the field is
// cleared in RowChange.value, so a row whose document dwarfs its other fields
// no longer re-ships the document on every unrelated write.
message FieldDelta {
	// The dotted path of the document. This path is the Protocol Buffers path
	// for a field on a singular chain. When the path crosses a keyed message
	// list or map, the element key is inserted into the path, such as
	// `notes.<key>.body`. This format matches a `PATCH` field mask, with one
	// entry per element.
	string field = 1;
	// The text delta-state fragment in format version `0x02` to apply to the
	// confirmed bytes of the field. An empty value indicates that the field
	// did not change over the span and you keep the existing state. The field
	// is always cleared in `RowChange.value`.
	bytes fragment = 2;
}

// RowChange is a full-row snapshot (or tombstone) at a given workspace
// sequence. Every field is a merged snapshot except the collaborative-text
// fields named in text_deltas, which the recipient reconstructs from state it
// already holds, and the fields named in hidden, which the recipient may not
// read.
message RowChange {
	// The name of the entity for this row.
	string entity = 1;
	// The key that identifies this row within the entity.
	string key = 2;
	// Workspace sequence number assigned to the mutation that last wrote this
	// row. Monotonic per workspace.
	uint64 version = 3;
	// The row content or deletion status.
	oneof body {
		// Serialized entity message. Full merged snapshot, EXCEPT that every
		// field named in text_deltas or in hidden is cleared.
		bytes value = 4;
		// True when the row was deleted.
		bool tombstone = 5;
	}
	// Collaborative-text fields shipped as delta state relative to the
	// recipient's cursor position. Empty on every path where the recipient's
	// prior state is not known to match that position — bootstrap, delta
	// resync, membership diffs, query results, and any scoped subscription
	// whose visibility could have changed. A recipient that cannot reconstruct
	// a named field must discard the page and re-bootstrap; one that knows in
	// advance it holds no schema for an entity names it in
	// PullRequest.no_delta_entities instead.
	repeated FieldDelta text_deltas = 6;
	// The fields of the row that the recipient may not read, sorted: each
	// entry names a top-level field outside any `oneof`, or a `oneof`. The
	// server clears each one in `value`, so a cleared field reads as its zero
	// value; this list tells it apart from a stored zero value. Empty when
	// the recipient reads every field. A field guard decides it (see
	// `syncplane.v1.FieldGuard`), per row, so two rows of one entity can
	// hide different fields, and a change of the recipient's access sends
	// the row again with a new list.
	//
	// A `PUT` that updates the row keeps the stored value of each field the
	// writer may not read and leaves unset, so a recipient can write the row
	// back whole.
	repeated string hidden = 7;
}

// Represents an ordered set of row changes to apply to confirmed state.
message Patch {
	// The ordered list of row changes to apply.
	repeated RowChange changes = 1;
	// Entities whose entire confirmed state the client must drop BEFORE
	// applying changes. Sent when an entity leaves the subscription set during
	// a delta resync — one name instead of a tombstone per row.
	repeated string drop_entities = 2;
}

// Subscription scopes what a client syncs. An empty subscription list means
// full sync; a subscription without a predicate covers the whole entity.
message Subscription {
	// The name of the entity to synchronize.
	string entity = 1;
	// Rows of the entity matching this predicate sync; absent = whole entity.
	Condition predicate = 2;
	// Reference paths to follow from matched rows. Following references
	// expands the synchronized set to a bounded-depth forward or reverse
	// closure, using key point-lookups forward and predicate scans in reverse.
	// When unset, synchronization remains scoped to the base entity. Changes
	// to this field are excluded from `sub_hash` and are reconciled through
	// closure diffs (`Cursor.closure`) rather than a base-scope delta
	// resynchronization. Every closure member remains subject to the same read
	// filter as a base row; following a reference never escalates permissions.
	FollowSpec follow = 3;
	// Bounds the synced set to the first `limit` rows of this subscription's
	// predicate match under `order_by` — so the working set is a policy choice
	// rather than the size of the entity. Absent ⇒ every matching row syncs.
	// Unlike `follow`, a window IS part of sub_hash: widening or removing one
	// needs rows the client does not hold, which only a delta resync can
	// supply.
	Window window = 4;
	// Rows named by key: exactly these rows of the entity sync, whatever their
	// fields hold. Set for "the documents this device has pinned" — a set the
	// entity's fields cannot express and that N per-key predicates would cost N
	// predicates to express. Mutually exclusive with `predicate` and `window`;
	// `follow` combines with it and walks references from the named rows.
	// Present-but-empty names no rows, which is different from absent (the
	// whole entity). Part of sub_hash, like a window: a changed set is
	// reconciled by a delta resync that reads only the rows named on either
	// side. A key the caller may not read is withheld, never refused. Bounded
	// by the server's MaxSubscriptionKeys.
	KeySet key_set = 5;
}

// KeySet names rows of one entity by key, in the row-key form
// CrudMutation.key carries (see docs/reference/naming.md). Order carries no
// meaning and duplicates are folded, so two sets with the same members hash
// alike.
message KeySet {
	// The list of row keys. Key order does not matter and duplicate keys are
	// folded.
	repeated string keys = 1;
}

// Window caps a subscription's scope by RANK rather than by attribute: "the
// N most recently updated open issues" instead of "every open issue".
//
// Membership is a set, not a boundary value — the server carries the exact
// key-set on the cursor and diffs a freshly computed window against it on
// every pull, so a row that fell off the tail is dropped precisely. That is
// the same machinery reference-following already uses.
message Window {
	// Total order over the matched rows; ties break on row key, so the rank
	// boundary is always well-defined. Mutually exclusive with by_recency.
	repeated OrderKey order_by = 1;
	// Maximum rows the window holds. Must be > 0 and <= the server's
	// MaxWindowSize.
	uint32 limit = 2;
	// Order by the row's workspace sequence, descending — "the N most recently
	// written matching rows". Needs no field decode to sort, so it is the
	// cheap window to serve. Recency is a property of the STORED ROW rather
	// than of the message, which is why it is a flag here instead of a magic
	// order path: no field of an entity could express it, and a reserved path
	// name would collide with a real field.
	bool by_recency = 3;
}

// RefPath names a chain of reference relations to follow from a root entity.
// Each segment is a forward ref field name or a reverse-relation name (the
// emitter resolves direction from the ref graph). Used by both query-time
// hydration (include) and reference-following subscriptions (follow).
message RefPath {
	// The ordered list of relation segments to traverse.
	repeated string segments = 1;
}

// Specifies reference paths to follow to a bounded depth. This message
// configures client-local hydration (`include`) and subscription scoping
// (`follow`). A `depth` of `0` is treated as `1` (one hop along each path).
message FollowSpec {
	// The reference paths to traverse.
	repeated RefPath paths = 1;
	// The maximum number of hops to traverse along each path. A value of `0`
	// is treated as `1` (one hop along each path).
	uint32 depth = 2;
}
