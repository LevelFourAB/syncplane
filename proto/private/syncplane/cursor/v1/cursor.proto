syntax = "proto3";

// Package syncplane.cursor.v1 holds the server's pull-position types — what is
// inside the opaque `bytes` cursor of Pull/Bootstrap/Subscribe.
//
// It is a SERVER-PRIVATE package. It lives apart from syncplane.v1 and is
// deliberately excluded from TypeScript generation (see buf.gen.ts.yaml), so
// "wire cursors are opaque tokens" holds because the client package has no
// cursor schema to import — not merely because the docs ask nicely. Nothing
// outside the engine should depend on these types.
//
// Only the engine encodes and decodes them. Changing them is a server-side
// change, but a cursor already held by a client must still decode: treat field
// numbers as permanent and add fields rather than repurposing them.
package syncplane.cursor.v1;

import "syncplane/v1/patch.proto";
import "syncplane/v1/query.proto";

option go_package = "github.com/levelfourab/syncplane/engine/gen/syncplane/cursor/v1;syncplanecursorv1";

// Cursor is the server's pull-position state.
message Cursor {
	// Workspace sequence the client has seen through.
	uint64 seq = 1;
	// Hash of the subscription set the cursor was issued under; 0 = full sync.
	// A mismatch on the next pull starts a delta resync into the new set (or
	// forces reset when the old set cannot be reconstructed).
	fixed64 sub_hash = 2;
	// Permissions filter epoch the cursor was issued under. A mismatch starts
	// a delta resync (apps implementing EpochReadFilters) or forces reset, so
	// visibility changes outside row edits propagate to clients.
	uint64 filter_epoch = 3;
	// The subscription set the cursor was issued under (the set sub_hash
	// hashes). Lets the server reconstruct the client's old scope and resync
	// only the visible-set difference after a subscription change.
	repeated syncplane.v1.Subscription subscriptions = 4;
	// Present while a delta resync is paging; absent on a settled cursor.
	ResyncState resync = 5;
	// Sub-position inside a same-version group when a pull page splits one.
	// Multiple rows can share one workspace sequence (a BatchMutation, a
	// multi-row custom mutator, Server.Mutate/Invoke). When a page boundary
	// lands inside such a group, seq names that version and these name the
	// last row already delivered within it (in (entity, key) order), so the
	// next pull resumes at the remaining rows instead of skipping them.
	// Empty on a clean version boundary (the common case).
	string partial_entity = 6;
	string partial_key = 7;
	// A random per-workspace identity, minted when the workspace is first
	// written and stable for its lifetime. It pins a cursor to the store
	// lineage that issued it: a cursor stamped with one epoch presented to a
	// store carrying a different one cannot have come from this store (the URL
	// now serves a swapped, recreated, or restored database), so pull resets
	// rather than splicing two lineages' histories together. 0 = a pre-write
	// cursor that carries no epoch; the server stamps the current one onto
	// every cursor it issues going forward.
	fixed64 store_epoch = 8;
	// The reference-following closure the cursor was issued under: the exact
	// set of (entity, key) rows the client holds via `follow` beyond its base
	// scope. The next pull brings the closure up to date against current data
	// and diffs it against this set, emitting rows that entered and tombstoning
	// rows that left (and are not otherwise base-visible) — which is also what
	// makes the set the INPUT to that update, since a member nothing touched
	// carries straight over. Absent on non-following subscriptions ⇒ empty.
	// Bounded by the server's MaxClosureSize, so the cursor stays bounded.
	ClosureSet closure = 9;
	// The windowed membership the cursor was issued under, as ONE set across
	// every window: the exact rows the client holds via a Subscription.window.
	// The next pull diffs its recomputed membership against this, so rows that
	// fell off the tail are dropped precisely rather than lingering.
	//
	// Written only by servers that predate `windows`, and read only from such a
	// cursor; a cursor carrying `windows` leaves this empty and the union is
	// derived. Both forms diff identically — the split one additionally says
	// which window holds what, which is what maintaining a window costs less
	// than rebuilding it.
	ClosureSet window = 10;
	// The windowed membership split per window, one entry per
	// Subscription.window in `subscriptions` order. Absent on non-windowed
	// subscriptions and on cursors older than this field. Bounded by the
	// server's MaxWindowSize per windowed subscription.
	repeated WindowState windows = 11;
	// Reference to an externally stored StoredSets entry holding what fields
	// 4, 9, 10 and 11 would otherwise inline. When set, those fields are empty
	// and the sets live in the server's cursor-state store; the cursor itself
	// stays a few dozen bytes however large the client's membership grows.
	// A referenced entry the store no longer holds resets the client, exactly
	// as a cursor below the tombstone horizon does — which is why servers
	// without a store, and entries too small to be worth a store round trip,
	// keep inlining instead.
	StateRef sets_ref = 12;
	// Set when `closure` was produced under a subscription set other than
	// `subscriptions`: a delta resync carries the old scope's closure onto the
	// cursor it completes with, because the resync reconciles base scope only
	// and leaves the closure to the pull that follows. The set still names
	// exactly the rows the client holds via `follow`, so the diff against it
	// stays exact, but it cannot be maintained from what changed since seq —
	// the seeds and paths it was walked from are the old scope's. The next
	// following pull walks the closure again from the new scope's seeds, and
	// clears this once it stores the rebuilt set at a clean version boundary.
	bool closure_rebuild = 13;
	// Set on the cursor a delta resync completes with, and kept by the pages of
	// the catch-up pull that follows it until one ends at a clean version
	// boundary. The resync reconciles the client's rows as of its seq only, so
	// a row the new scope or access shows that was written past that seq
	// reaches the client for the first time on some page of the catch-up —
	// which therefore ships every row as full state, since delta state presumes
	// the client holds the row as of the page's cursor.
	bool resynced = 14;
	// Fingerprint of the read rules of the access model the cursor was issued
	// under (see ReadAccess.rules), 0 for a schema without the model. A pull
	// under other rules compares the stored rules entity by entity, and resets
	// when an entity both sides know reads by another rule, or when no stored
	// ReadAccess names the rules.
	fixed64 access_policy = 15;
	// Hash of what the caller could read when the cursor was issued: its
	// subjects and, per read permission, the anchors it held the permission at
	// (see ReadAccess). A pull that finds a different hash resyncs the rows
	// under the anchors that changed. 0 for a schema without the model.
	fixed64 access_hash = 16;
	// Reference to the stored ReadAccess the hash was computed from. Never
	// inlined: a resync tombstones rows by what this names, so a client must
	// not be able to write it. Absent when the store could not take the entry;
	// a later change of access then resets the client.
	StateRef access_ref = 17;
	// Hash of the CallerAccess the client last received: every permission the
	// caller holds, not only the ones entities read by. It is the summary's
	// CallerAccess.version. A client that sends no
	// PullRequest.caller_access_version receives a new CallerAccess when the
	// hash differs. 0 for a schema without the model.
	fixed64 caller_access_hash = 18;
	// The sequence through which the rows the client holds reflect every
	// access move (see AccessMove). A pull compares the client's rows with
	// the moves after the greater of seq and this, so the pull that follows a
	// resync does not resync the same moves again. 0 when seq alone says it.
	uint64 access_moves_through = 19;
	// Reference to the stored syncplane.v1.CallerAccess whose version is
	// caller_access_hash, with seq 0. A pull whose client holds that version
	// is sent the change from it as a CallerAccessDelta. It has its own
	// lineage, apart from access_ref's, so a change to only one of the two
	// writes only one entry. Absent when the store could not take the entry,
	// and on cursors of clients that apply no CallerAccessDelta.
	StateRef caller_access_ref = 20;
	// Keyed hash of seq and access_moves_through under the seq_key of the
	// ReadAccess that access_ref names. A resync from that entry reads only
	// rows at or below seq, and a client can edit seq, so the resync trusts
	// the two values only when the tag matches; otherwise the client resets.
	// 0 when access_ref is absent, and on cursors older than the field.
	fixed64 access_tag = 21;
}

// AccessMove is one change of the access parent of a row that other rows sit
// below: a move to another parent, a change of what access rules' within
// checks read of the row, or the row's creation or deletion. The rows below
// it change visibility without being written, so the server
// records the change in the transaction that makes it, as a row of an entity
// no schema declares, at the change's sequence. A pull reads the moves after
// its cursor and resyncs the rows below each one that changes what the client
// can read.
message AccessMove {
	// The row whose access parent changed.
	string entity = 1;
	string key = 2;
	// The first of the row's access parents before the change, as of the start
	// of the sequence, in entity and then key order; absent when the row did
	// not exist or anchored at nothing. more_from holds the others, in the
	// same order.
	AnchorRef from = 3;
	// The first of the row's access parents after the change; absent when the
	// row was deleted or anchors at nothing. more_to holds the others.
	AnchorRef to = 4;
	repeated AnchorRef more_from = 5;
	repeated AnchorRef more_to = 6;
	// What the access rules' within checks read of the row before the change,
	// as of the start of the sequence. Set only for a row of an entity that a
	// within check names, and only when the row existed: absent, the row
	// passed no such check.
	WithinState from_within = 7;
}

// WithinState is what the within checks that name one entity read of one of
// its rows.
message WithinState {
	// The value of each subject field a check reads, by field name.
	map<string, string> subjects = 1;
	// The conditions the row matched, each as the canonical form of a check's
	// when condition, sorted.
	repeated string matched = 2;
}

// AnchorRef names one row of a workspace.
message AnchorRef {
	string entity = 1;
	string key = 2;
}

// ReadAccess is what a caller could read when a cursor was issued, stored in
// the cursor-state store under Cursor.access_ref. Every list is sorted, so
// equal access holds equal values. Cursor.access_hash and
// Cursor.access_policy hash the engine's canonical encoding of it, which reads
// the field values by field number and not the encoded bytes, so a field that
// is not set leaves both hashes as they were.
message ReadAccess {
	// The caller's subjects. A cursor presented by a caller with other subjects
	// cannot resync from this entry.
	repeated string subjects = 1;
	// One entry per permission that some entity reads by, sorted by permission.
	repeated PermissionAnchors permissions = 2;
	// The read rule of every entity in the access model the entry was recorded
	// under, sorted by entity. They and max_access_depth hash to
	// Cursor.access_policy, and Cursor.access_hash leaves them out.
	repeated EntityReadRule rules = 3;
	// The longest parent chain a read walks (Limits.MaxAccessDepth). A cursor
	// recorded under another limit cannot resync from this entry.
	uint32 max_access_depth = 4;
	// Random key that Cursor.access_tag is computed with. It never leaves the
	// server, so a client cannot compute the tag of another position. Neither
	// hash reads it.
	bytes seq_key = 5;
}

// EntityReadRule is what decides which rows of one entity a caller reads, and
// which of their fields: who reads them, through which access parents, and
// what each guard that can hide fields admits. Two equal rules read the same
// rows and fields from the same anchors. A rule feature added later is a new
// field, which a rule that does not use it leaves unset.
message EntityReadRule {
	string entity = 1;
	// A text form of the rule, which the first records held.
	reserved 2;
	reserved "rule";
	// Set for an entity outside the access model, whose rows every admitted
	// caller reads.
	bool open = 3;
	// Who reads the rows.
	ReadersRule read = 4;
	// The access parents, one per reference case, sorted by path and entity.
	repeated ParentCase parents = 5;
	// The guards that can hide fields, sorted by their units.
	repeated HidingGuard hides = 6;
}

// ReadersRule is who reads the rows of an entity, or the fields of a guard.
message ReadersRule {
	// Every admitted caller reads every row.
	bool all = 1;
	// The permissions of the rules that check nothing on the row, sorted.
	repeated string permissions = 2;
	// The rules with a check on the row or above it, or that need more than
	// one permission, in the engine's order.
	repeated CheckedRule checked = 3;
}

// CheckedRule is one access rule of a ReadersRule.checked list.
message CheckedRule {
	// The operations the rule admits, by name, in the engine's order.
	repeated string ops = 1;
	// The permissions the rule needs, sorted; empty for a rule that admits
	// every admitted caller.
	repeated string requires = 2;
	// The field that must hold one of the caller's subjects.
	string caller_is = 3;
	// The condition a row must match.
	syncplane.v1.Condition when = 4;
	// The rule's within entries, in the engine's order.
	repeated WithinRule within = 5;
}

// WithinRule is one within entry of an access rule.
message WithinRule {
	string entity = 1;
	string caller_is = 2;
	syncplane.v1.Condition when = 3;
}

// ParentCase is one case of an entity's access parent: the reference that
// names the parent row, and the parent's entity.
message ParentCase {
	string path = 1;
	string entity = 2;
}

// HidingGuard is a guard that can hide fields from a caller.
message HidingGuard {
	// The units the guard restricts, sorted.
	repeated string units = 1;
	// Who reads them.
	ReadersRule read = 2;
}

// PermissionAnchors is where a caller held one permission.
message PermissionAnchors {
	string permission = 1;
	// Held at the workspace root, which covers every row.
	bool root = 2;
	// The anchor rows, per entity, sorted by entity and key.
	repeated ClosureSet.Entry rows = 3;
}

// StateRef names one immutable entry in the cursor-state store. The pair is
// the identity: id is the lineage a client's successive cursors share (minted
// when a snapshot starts, carried forward on every reissue, and what lets a
// store prune a lineage's superseded entries), gen distinguishes the entries
// within it and is random rather than sequential, so two pulls advancing the
// same cursor concurrently write two entries instead of colliding on one.
message StateRef {
	fixed64 id = 1;
	fixed64 gen = 2;
}

// StoredSets is the bulky tail of a Cursor, stored once instead of restated
// on every page: the subscription set and both bounded membership key-sets.
// Encoded deterministically — each key list sorted unless its order is
// meaningful, as closureRows.keySet and rowEmitter.windowStates emit them —
// so equal membership produces equal bytes and a reissued cursor keeps its
// ref instead of writing a new entry.
message StoredSets {
	// Cursor.subscriptions.
	repeated syncplane.v1.Subscription subscriptions = 1;
	// Cursor.closure.
	ClosureSet closure = 2;
	// Cursor.windows.
	repeated WindowState windows = 3;
	// Cursor.window — carried only when adopting a cursor from a server that
	// predates `windows`, so nothing is lost in the exchange.
	ClosureSet window = 4;
}

// WindowState is one Subscription.window's membership plus the position of its
// weakest member. The position is what lets a pull decide a changed row's
// membership by COMPARISON — is it ahead of the tail? — instead of resolving
// the window from scratch, which costs a read per member however little moved.
message WindowState {
	// Index into Cursor.subscriptions of the windowed subscription this
	// describes. A pull that cannot line its own subscription list up with the
	// cursor's, position for position, rebuilds instead of maintaining.
	uint32 subscription = 1;
	// Member row keys of that subscription's entity.
	//
	// Ordered best-first for a by_recency window, where the order is
	// maintainable for free — every row written since the cursor outranks every
	// member, so entering rows go to the front and evictions come off the tail.
	// An order_by window cannot place an entering row without reading its
	// neighbours, so it locates the tail with `boundary` instead and leaves
	// these sorted.
	repeated string keys = 2;
	// The weakest member's position in the window's order_by ordering, as the
	// bytes query.Order.Cursor produces. Empty for a by_recency window (which
	// needs no comparison, see `keys`) and for an empty window.
	bytes boundary = 3;
}

// ClosureSet records a bounded membership set as a per-entity list of row
// keys. Two features ride on it — the reference-following closure and the
// windowed subscription set — because both are memberships that cannot be
// derived per row and so must be STORED to be diffed. Keeping the prior set
// (rather than reconstructing it from a spec) is what makes drops exact.
message ClosureSet {
	message Entry {
		string entity = 1;
		repeated string keys = 2;
	}
	repeated Entry entries = 1;
}

// ResyncState marks a cursor mid delta-resync: the difference between the
// client's old visible set (under the Cursor's seq / sub_hash / filter_epoch
// / subscriptions) and its new one is streaming out in (entity, key) scan
// order. Rows written after the Cursor's seq are not part of the scan; the
// catch-up pull that follows the resync delivers them under the new scope.
message ResyncState {
	// Scan position: the next page resumes at the first subscribed entity
	// >= entity, skipping keys <= after_key within it.
	string entity = 1;
	string after_key = 2;
	// The scope the resync converges on. Each resync pull must still carry a
	// subscription set hashing to to_sub_hash and find the workspace at
	// to_filter_epoch; any further change mid-resync falls back to reset.
	fixed64 to_sub_hash = 3;
	uint64 to_filter_epoch = 4;
	// The access hash the resync converges on (see Cursor.access_hash). A pull
	// that finds the caller's access moved again mid-resync resets.
	fixed64 to_access_hash = 5;
	// The newest access move the resync accounts for (see AccessMove). A pull
	// that finds a later move that changes what the client can read resets.
	uint64 to_moves_through = 6;
}

// BootstrapPosition is how far an interrupted Bootstrap got: what rides inside
// the opaque BootstrapResume.token. It records the delivered set by NAME rather
// than as a position in the delivery order, because that order is not stable
// across attempts — a client may ask for different priority entities, and the
// catalog may gain an entity between attempts. A resumed scan then skips
// exactly what already shipped and covers everything else in full, whatever
// order the resumed stream delivers it in.
message BootstrapPosition {
	// Entities whose scan ran to completion, in no particular order. Every row
	// of these that the snapshot ships has been delivered.
	repeated string done = 1;
	// The entity that was mid-scan, and the last row key delivered within it.
	// The resumed scan restarts this entity after that key. Empty when the
	// interruption fell on an entity boundary.
	string entity = 2;
	string after_key = 3;
}
