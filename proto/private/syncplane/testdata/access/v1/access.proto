syntax = "proto3";

// An access-model schema used only by the engine and client test suites: an
// org whose members hold roles on the whole workspace, projects with members
// of their own, and tasks below the projects.
package syncplane.testdata.access.v1;

import "syncplane/v1/options.proto";

option go_package = "github.com/levelfourab/syncplane/engine/gen/syncplane/testdata/access/v1;accessv1";

// A role on the whole workspace.
message OrgMember {
	option (syncplane.v1.entity) = {
		name: "org_member"
		key_fields: [ "id" ]
		grant: {
			subject: "user_id"
			role: "role"
			roles: [
				{
					name: "org_member"
					grants: [ "view_projects", "view_tasks", "view_labels" ]
				},
				{
					name: "org_admin"
					grants: [
						"view_members",
						"manage_members",
						"view_projects",
						"edit_projects",
						"view_tasks",
						"edit_tasks",
						"view_labels"
					]
				}
			]
		}
		access: {
			allow: [
				{ read: true permission: "view_members" },
				{ write: true permission: "manage_members" }
			]
		}
	};
	string id = 1;
	string user_id = 2;
	string role = 3;
}

message Project {
	option (syncplane.v1.entity) = {
		name: "project"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_projects" },
				{ write: true permission: "edit_projects" }
			]
		}
	};
	string id = 1;
	string name = 2;
}

// A role on one project and the rows below it.
message ProjectMember {
	option (syncplane.v1.entity) = {
		name: "project_member"
		key_fields: [ "id" ]
		grant: {
			subject: "user_id"
			role: "role"
			roles: [
				{
					name: "project_reader"
					grants: [ "view_projects", "view_members", "view_tasks" ]
				},
				{
					name: "project_writer"
					includes: [ "project_reader" ]
					grants: [ "edit_tasks" ]
				},
				{
					name: "project_admin"
					includes: [ "project_writer" ]
					grants: [ "manage_members" ]
				},
				{
					name: "project_editor"
					grants: [ "view_projects", "edit_tasks" ]
				},
				{
					name: "project_owner"
					includes: [ "project_admin" ]
					grants: [ "edit_projects" ]
				}
			]
		}
		access: {
			allow: [
				{ read: true permission: "view_members" },
				{ write: true permission: "manage_members" }
			]
		}
	};
	string id = 1;
	Project project = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	string user_id = 3;
	string role = 4;
}

message Task {
	option (syncplane.v1.entity) = {
		name: "task"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_tasks" },
				{ write: true permission: "edit_tasks" }
			]
		}
	};
	string id = 1;
	Project project = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	string title = 3;
}

// A comment on a task, two access_parent hops below its project. Registered
// with the org schema by the specs that walk chains deeper than one level.
message Comment {
	option (syncplane.v1.entity) = {
		name: "comment"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_tasks" },
				{ write: true permission: "edit_tasks" }
			]
		}
	};
	string id = 1;
	Task task = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	string body = 3;
}

// A page on a task, two access_parent hops below its project, whose body is
// collaborative text. A caller who can read the task's tasks reads it, and so
// does its owner where they can read the project. Registered with the org
// schema by the specs that ship text to readers below the workspace root.
message Page {
	option (syncplane.v1.entity) = {
		name: "page"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_tasks" },
				{ read: true permission: "view_projects" subject: "owner_id" },
				{ write: true permission: "edit_tasks" }
			]
		}
	};
	string id = 1;
	Task task = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	string owner_id = 3;
	bytes body = 4 [(syncplane.v1.field_behavior) = { text: true }];
}

// Readable by every org member. No rule admits a write, so only trusted
// writes create, change and delete labels.
message Label {
	option (syncplane.v1.entity) = {
		name: "label"
		key_fields: [ "id" ]
		access: { allow: [ { read: true permission: "view_labels" } ] }
	};
	string id = 1;
	string name = 2;
}

// Every admitted caller reads and writes it.
message Note {
	option (syncplane.v1.entity) = {
		name: "note"
		key_fields: [ "id" ]
		access: {
			allow: [ {
				read: true
				write: true
				admitted: {}
			} ]
		}
	};
	string id = 1;
	string body = 2;
}

// An entry in an append-only log: a caller who can read tasks posts one, and
// no rule admits an update or a delete. Registered with the org schema by the
// specs that check which write operations a rule set leaves to trusted writes.
message Entry {
	option (syncplane.v1.entity) = {
		name: "entry"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_tasks" },
				{ create: true permission: "view_tasks" }
			]
		}
	};
	string id = 1;
	string body = 2;
}

// The args of the test mutators that act on one task.
message TaskArgs {
	string task_id = 1;
}

// Roles a TeamMember row can hold, matched by value name.
enum TeamRole {
	TEAM_ROLE_UNSPECIFIED = 0;
	TEAM_ROLE_VIEWER = 1;
	TEAM_ROLE_EDITOR = 2;
}

// A grant entity whose role field is an enum. Registered on its own with
// Team, apart from the org schema above.
message TeamMember {
	option (syncplane.v1.entity) = {
		name: "team_member"
		key_fields: [ "id" ]
		grant: {
			subject: "user_id"
			role: "role"
			roles: [
				{
					name: "TEAM_ROLE_VIEWER"
					grants: [ "view_team" ]
				},
				{
					name: "TEAM_ROLE_EDITOR"
					grants: [ "view_team", "edit_team" ]
				}
			]
		}
		access: {
			allow: [
				{ read: true permission: "view_team" },
				{ write: true permission: "edit_team" }
			]
		}
	};
	string id = 1;
	Team team = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	string user_id = 3;
	TeamRole role = 4;
}

message Team {
	option (syncplane.v1.entity) = {
		name: "team"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_team" },
				{ write: true permission: "edit_team" }
			]
		}
	};
	string id = 1;
}

// A folder inside a folder, or at the top when parent is unset. Registered
// with FolderMember and Doc, apart from the org schema above.
message Folder {
	option (syncplane.v1.entity) = {
		name: "folder"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_folders" },
				{ write: true permission: "edit_folders" }
			]
		}
	};
	string id = 1;
	Folder parent = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	string name = 3;
}

// A role on one folder and everything below it.
message FolderMember {
	option (syncplane.v1.entity) = {
		name: "folder_member"
		key_fields: [ "id" ]
		grant: {
			subject: "user_id"
			role: "role"
			roles: [
				{
					name: "folder_viewer"
					grants: [ "view_folders" ]
				},
				{
					name: "folder_editor"
					grants: [ "view_folders", "edit_folders" ]
				},
				{
					name: "folder_manager"
					grants: [ "view_folders", "edit_folders", "manage_folders" ]
				}
			]
		}
		access: {
			allow: [
				{ read: true permission: "view_folders" },
				{ write: true permission: "manage_folders" }
			]
		}
	};
	string id = 1;
	Folder folder = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	string user_id = 3;
	string role = 4;
}

// A document in a folder.
message Doc {
	option (syncplane.v1.entity) = {
		name: "doc"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_folders" },
				{ write: true permission: "edit_folders" }
			]
		}
	};
	string id = 1;
	Folder folder = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	string title = 3;
}

// A board, the top of one of two trees in the polymorphic schema below:
// Board, Space, PlaceMember, Card, CardItem and Pin, registered apart from
// the schemas above.
message Board {
	option (syncplane.v1.entity) = {
		name: "board"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_places" },
				{ write: true permission: "edit_places" }
			]
		}
	};
	string id = 1;
}

// A space, the top of the other tree.
message Space {
	option (syncplane.v1.entity) = {
		name: "space"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_places" },
				{ write: true permission: "edit_places" }
			]
		}
	};
	string id = 1;
}

// A role on one board or one space and the rows below it.
message PlaceMember {
	option (syncplane.v1.entity) = {
		name: "place_member"
		key_fields: [ "id" ]
		grant: {
			subject: "user_id"
			role: "role"
			roles: [
				{
					name: "place_viewer"
					grants: [
						"view_places",
						"view_place_members",
						"view_cards",
						"view_pins"
					]
				},
				{
					name: "place_editor"
					grants: [
						"view_places",
						"view_place_members",
						"view_cards",
						"edit_cards",
						"view_pins",
						"edit_pins"
					]
				},
				{
					name: "place_admin"
					grants: [
						"view_places",
						"edit_places",
						"view_place_members",
						"manage_place_members",
						"view_cards",
						"edit_cards",
						"view_pins",
						"edit_pins"
					]
				}
			]
		}
		access: {
			allow: [
				{ read: true permission: "view_place_members" },
				{ write: true permission: "manage_place_members" }
			]
		}
	};
	string id = 1;
	oneof place {
		Board board = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
		Space space = 3 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	}
	string user_id = 4;
	string role = 5;
}

// A card on a board or in a space: below whichever of the two it names.
message Card {
	option (syncplane.v1.entity) = {
		name: "card"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_cards" },
				{ write: true permission: "edit_cards" }
			]
		}
	};
	string id = 1;
	oneof place {
		Board board = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
		Space space = 3 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	}
	string title = 4;
}

// An item on a card, two access_parent hops below the card's board or space.
message CardItem {
	option (syncplane.v1.entity) = {
		name: "card_item"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_cards" },
				{ write: true permission: "edit_cards" }
			]
		}
	};
	string id = 1;
	Card card = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	string text = 3;
}

// A reference to a board or a space.
message PlaceRef {
	option (syncplane.v1.reference) = {
	};

	oneof target {
		Board board = 1;
		Space space = 2;
	}
}

// A pin on a board or in a space, placed through a reference message rather
// than a oneof of its own.
message Pin {
	option (syncplane.v1.entity) = {
		name: "pin"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_pins" },
				{ write: true permission: "edit_pins" }
			]
		}
	};
	string id = 1;
	PlaceRef place = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	string label = 3;
}

// A room, the top of the owner-rule schema below: Room, RoomMember, Post,
// Draft, Ticket and Setting, registered apart from the schemas above.
message Room {
	option (syncplane.v1.entity) = {
		name: "room"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_rooms" },
				{ write: true permission: "edit_rooms" }
			]
		}
	};
	string id = 1;
	string name = 2;
}

// A role on one room and the rows below it. A member can leave the room by
// deleting their own row.
message RoomMember {
	option (syncplane.v1.entity) = {
		name: "room_member"
		key_fields: [ "id" ]
		grant: {
			subject: "user_id"
			role: "role"
			roles: [
				{
					name: "room_viewer"
					grants: [ "view_rooms", "view_room_members", "view_posts" ]
				},
				{
					name: "room_poster"
					grants: [
						"view_rooms",
						"view_room_members",
						"view_posts",
						"post"
					]
				},
				{
					name: "room_moderator"
					grants: [
						"view_rooms",
						"edit_rooms",
						"view_room_members",
						"manage_room_members",
						"view_posts",
						"post",
						"moderate_posts"
					]
				}
			]
		}
		access: {
			allow: [
				{ read: true permission: "view_room_members" },
				{ write: true permission: "manage_room_members" },
				{ delete: true permission: "view_rooms" subject: "user_id" }
			]
		}
	};
	string id = 1;
	Room room = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	string user_id = 3;
	string role = 4;
}

// A post in a room: its author edits the body and deletes it, and a
// moderator edits or deletes any post.
message Post {
	option (syncplane.v1.entity) = {
		name: "post"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_posts" },
				{
					create: true
					delete: true
					permission: "post"
					subject: "author_id"
				},
				{
					update: true
					permission: "post"
					subject: "author_id"
					fields: [ "body" ]
				},
				{ update: true delete: true permission: "moderate_posts" }
			]
		}
	};
	string id = 1;
	Room room = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	string author_id = 3 [(syncplane.v1.field_behavior) = { creator: {} }];
	string body = 4;
	string title = 5;
}

// A draft in a room, which only its author reads and writes while they can
// read the room's posts.
message Draft {
	option (syncplane.v1.entity) = {
		name: "draft"
		key_fields: [ "id" ]
		access: {
			allow: [ {
				read: true
				write: true
				permission: "view_posts"
				subject: "author_id"
			} ]
		}
	};
	string id = 1;
	Room room = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	string author_id = 3 [(syncplane.v1.field_behavior) = { creator: {} }];
	string body = 4;
}

// A ticket in a room: a moderator writes it, and its assignee changes its
// status.
message Ticket {
	option (syncplane.v1.entity) = {
		name: "ticket"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_posts" },
				{ write: true permission: "moderate_posts" },
				{
					update: true
					permission: "view_posts"
					subject: "assignee_id"
					fields: [ "status" ]
				}
			]
		}
	};
	string id = 1;
	Room room = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	string assignee_id = 3;
	string status = 4;
	string title = 5;
}

// The settings of one user, which every admitted caller reads and writes for
// themselves only.
message Setting {
	option (syncplane.v1.entity) = {
		name: "setting"
		key_fields: [ "user_id" ]
		access: {
			allow: [ {
				read: true
				write: true
				admitted: {}
				subject: "user_id"
			} ]
		}
	};
	string user_id = 1;
	string theme = 2;
}

// A squad, the team of the team schema below: Squad, SquadMember, Repo,
// RepoMember, RepoSquad and Issue, registered apart from the schemas above.
message Squad {
	option (syncplane.v1.entity) = {
		name: "squad"
		key_fields: [ "id" ]
		members: { entity: "squad_member" }
		access: {
			allow: [
				{ read: true permission: "view_squads" },
				{ write: true permission: "manage_squads" }
			]
		}
	};
	string id = 1;
}

// Makes its user a member of one squad, whatever the role.
message SquadMember {
	option (syncplane.v1.entity) = {
		name: "squad_member"
		key_fields: [ "id" ]
		grant: {
			subject: "user_id"
			role: "role"
			roles: [
				{
					name: "squad_member"
					grants: [ "view_squads" ]
				},
				{
					name: "squad_lead"
					grants: [ "view_squads", "manage_squads" ]
				}
			]
		}
		access: {
			allow: [
				{ read: true permission: "view_squads" },
				{ write: true permission: "manage_squads" }
			]
		}
	};
	string id = 1;
	Squad squad = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	string user_id = 3;
	string role = 4;
}

message Repo {
	option (syncplane.v1.entity) = {
		name: "repo"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_repos" },
				{ write: true permission: "edit_repos" }
			]
		}
	};
	string id = 1;
}

// A role on one repo for one user, or for every member of one squad. A user
// can leave the repo by deleting their own row.
message RepoMember {
	option (syncplane.v1.entity) = {
		name: "repo_member"
		key_fields: [ "id" ]
		grant: {
			subject: "member"
			role: "role"
			roles: [
				{
					name: "repo_reader"
					grants: [ "view_repos", "view_repo_members", "view_issues" ]
				},
				{
					name: "repo_writer"
					grants: [
						"view_repos",
						"view_repo_members",
						"view_issues",
						"edit_issues"
					]
				},
				{
					name: "repo_admin"
					grants: [
						"view_repos",
						"edit_repos",
						"view_repo_members",
						"manage_repo_members",
						"view_issues",
						"edit_issues"
					]
				}
			]
		}
		access: {
			allow: [
				{ read: true permission: "view_repo_members" },
				{ write: true permission: "manage_repo_members" },
				{ delete: true permission: "view_repos" subject: "user_id" }
			]
		}
	};
	string id = 1;
	Repo repo = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	oneof member {
		string user_id = 3;
		Squad squad = 4;
	}
	string role = 5;
}

// A role on one repo for every member of one squad, named by a plain
// reference rather than a oneof.
message RepoSquad {
	option (syncplane.v1.entity) = {
		name: "repo_squad"
		key_fields: [ "id" ]
		grant: {
			subject: "squad"
			role: "role"
			roles: [ {
				name: "repo_squad_reader"
				grants: [ "view_repos", "view_issues" ]
			} ]
		}
		access: {
			allow: [
				{ read: true permission: "view_repo_members" },
				{ write: true permission: "manage_repo_members" }
			]
		}
	};
	string id = 1;
	Repo repo = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	Squad squad = 3;
	string role = 4;
}

// An issue in a repo.
message Issue {
	option (syncplane.v1.entity) = {
		name: "issue"
		key_fields: [ "id" ]
		access: {
			allow: [
				{ read: true permission: "view_issues" },
				{ write: true permission: "edit_issues" }
			]
		}
	};
	string id = 1;
	Repo repo = 2 [(syncplane.v1.field_behavior) = { access_parent: {} }];
	string title = 3;
}
