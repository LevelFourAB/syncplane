syntax = "proto3";

// Entities used only by the engine and client test suites.
package syncplane.testdata.v1;

import "syncplane/v1/options.proto";

option go_package = "github.com/levelfourab/syncplane/engine/gen/syncplane/testdata/v1;testdatav1";

message Widget {
	option (syncplane.v1.entity) = {
		name: "widget"
		key_fields: [ "id" ]
	};

	string id = 1;
	string label = 2;
	int32 count = 3;
	Settings settings = 4;
	// Opaque: replaced whole during merges even when a mask names sub-fields.
	Blob doc = 5 [(syncplane.v1.field_behavior) = { opaque: true }];
	// Scalar set: merge by value, dups collapse, order not preserved.
	repeated string tags = 6;
	// int64 surfaces as bigint in TS — exercises number/bigint coercion.
	int64 big = 7;
	// Explicit presence — exercises isSet/isNotSet vs implicit fields.
	optional string maybe = 8;
	bool flag = 9;
	// Opaque bytes — exercises bytes-kind merge hooks.
	bytes raw = 10 [(syncplane.v1.field_behavior) = { opaque: true }];
	// Map with a string key — per-item merge by map key.
	map<string, string> attrs = 11;
	// Map with a non-string key — exercises int64 key encode/decode.
	map<int64, string> by_id = 12;
	// Message-valued map: the shape an app declares for user-defined fields.
	// The value is an APP-defined oneof, so a query names the variant it means
	// (`custom.priority.number`) and the engine never has to rank two variants
	// against each other — a member has explicit presence, so the wrong variant
	// simply reads as not found.
	map<string, FieldValue> custom = 23;
	// Keyed message list — identity is the explicit "uid" field.
	repeated Member members = 13
		[(syncplane.v1.field_behavior) = { key_field: "uid" }];
	// Keyed message list — identity inferred from the element entity's
	// key_fields.
	repeated Pair refs = 14;
	// Atomic list: opt out of set/keyed merge, replaced whole.
	repeated string atomic_tags = 15
		[(syncplane.v1.field_behavior) = { opaque: true }];
	// Movable list — keyed by "id", ordered by the fractional "pos" field.
	repeated Item items = 16 [
		(syncplane.v1.field_behavior) = { key_field: "id" order_field: "pos" }
	];
	// Collaborative text — the engine auto-installs the text CRDT merger, so
	// concurrent PATCHes to this field converge without interleaving.
	bytes body = 17 [(syncplane.v1.field_behavior) = { text: true }];
	// Floating point — the only field that can hold NaN or ±Inf, which both
	// evaluators rank apart from every real value rather than tying.
	double ratio = 18;
	// Unsigned 64-bit — the counterpart to `big`. The two surface identically
	// as bigints but index differently (unsigned bytes are already in order,
	// signed ones are biased), so both branches need a field.
	uint64 ubig = 19;
	// Oneof group. One field for merge purposes: a mask names the GROUP
	// ("choice"), never a member, and the group is replaced whole — including
	// the message member, which is why no sub-path into it is accepted. Members
	// stay individually addressable for reading (queries, indexes), where
	// presence means "this case is active".
	oneof choice {
		string choice_text = 20;
		int32 choice_number = 21;
		Settings choice_settings = 22;
	}
}

// Value of Widget.custom — what an app declares when its users define their
// own fields. The engine knows nothing about this type: the oneof, its members
// and their names all belong to the app, and a query addresses one member by
// name. `labels` is how multi-select is expressed without an engine concept for
// it — a message wrapping a repeated scalar, so `custom.<key>.labels.values` is
// an ordinary repeated leaf that hasAny/hasAll already understand.
message FieldValue {
	oneof kind {
		string text = 1;
		double number = 2;
		bool checked = 3;
		StringList labels = 4;
		// Deliberately incomparable: no path ever asks the engine to rank two
		// attachments, so a member no comparison can reach costs nothing.
		Blob attachment = 5;
	}
}

message StringList {
	repeated string values = 1;
}

// Fields a client may not write, one per shape the carry-over and the mask
// refusal have to handle: a scalar, a message a mask can descend into, a
// collaborative-text field whose union must not run, and a oneof protected as a
// group. `label` and `settings` stay writable so a test can tell "this write
// landed except for the protected part" from "this write was refused".
message Guarded {
	option (syncplane.v1.entity) = {
		name: "guarded"
		key_fields: [ "id" ]
	};

	string id = 1;
	string label = 2;
	string owner = 3 [(syncplane.v1.field_behavior) = {
		write_policy: FIELD_WRITE_POLICY_TRUSTED_ONLY
	}];
	Settings audit = 4 [(syncplane.v1.field_behavior) = {
		write_policy: FIELD_WRITE_POLICY_TRUSTED_ONLY
	}];
	bytes summary = 5 [(syncplane.v1.field_behavior) = {
		text: true
		write_policy: FIELD_WRITE_POLICY_TRUSTED_ONLY
	}];
	Settings settings = 6;
	// Marked on one member; the whole group is protected.
	oneof state {
		string state_name = 7 [(syncplane.v1.field_behavior) = {
			write_policy: FIELD_WRITE_POLICY_TRUSTED_ONLY
		}];
		int32 state_code = 8;
	}
}

// Registration-rejection fixtures. Each carries a construct on a path no mask
// ever reaches: below a oneof, whose group is replaced whole, or inside an
// unkeyed repeated element, which masked writes replace whole. Registering any
// of these must fail.

// A key field inside a oneof: the row key would vanish whenever a sibling case
// won.
message OneofKeyEntity {
	option (syncplane.v1.entity) = {
		name: "oneof_key"
		key_fields: [ "id" ]
	};

	oneof which {
		string id = 1;
		string other = 2;
	}
}

// A protected key field: a PATCH can never move a key field and a PUT that
// changed one would address a different row, so the mark could only mislead.
message ProtectedKeyEntity {
	option (syncplane.v1.entity) = {
		name: "protected_key"
		key_fields: [ "id" ]
	};

	string id = 1 [(syncplane.v1.field_behavior) = {
		write_policy: FIELD_WRITE_POLICY_TRUSTED_ONLY
	}];
	string label = 2;
}

// A text field inside a oneof: the CRDT merger could never run, because the
// group replaces whole.
message OneofTextEntity {
	option (syncplane.v1.entity) = {
		name: "oneof_text"
		key_fields: [ "id" ]
	};

	string id = 1;
	oneof which {
		bytes body = 2 [(syncplane.v1.field_behavior) = { text: true }];
		string plain = 3;
	}
}

// A text field one level BELOW a oneof member: same reason, one indirection
// further out.
message OneofNestedTextEntity {
	option (syncplane.v1.entity) = {
		name: "oneof_nested_text"
		key_fields: [ "id" ]
	};

	string id = 1;
	oneof which {
		TextHolder holder = 2;
		string plain = 3;
	}
}

message TextHolder {
	bytes body = 1 [(syncplane.v1.field_behavior) = { text: true }];
}

// A text field inside an UNKEYED repeated element: without an element identity
// no mask can address the element, so it is replaced whole and the CRDT merger
// could never run.
message ListTextEntity {
	option (syncplane.v1.entity) = {
		name: "list_text"
		key_fields: [ "id" ]
	};

	string id = 1;
	repeated TextHolder notes = 2;
}

// Accepted shapes: a text field inside a keyed list element or a map value
// holds one document PER ELEMENT, addressed by instance path
// ("notes.<id>.body", "sections.<key>.body").

// A map whose values carry collaborative text.
message MapTextEntity {
	option (syncplane.v1.entity) = {
		name: "map_text"
		key_fields: [ "id" ]
	};

	string id = 1;
	map<string, TextHolder> notes = 2;
}

// A keyed list whose elements carry collaborative text, directly and one
// singular message deeper, plus a map alongside — the shapes the per-element
// plumbing (delta log, floors, cache, history, plain-string writes) must key
// by instance path.
message KeyedTextEntity {
	option (syncplane.v1.entity) = {
		name: "keyed_text"
		key_fields: [ "id" ]
	};

	string id = 1;
	string title = 2;
	repeated KeyedNote notes = 3
		[(syncplane.v1.field_behavior) = { key_field: [ "id" ] }];
	map<string, TextHolder> sections = 4;
}

message KeyedNote {
	string id = 1;
	string label = 2;
	bytes body = 3 [(syncplane.v1.field_behavior) = { text: true }];
	TextHolder deep = 4;
}

// A keyed-list identity inside the element's oneof: the moment a sibling case
// won a write, every such element would collapse onto the zero value and
// collide.
message OneofListIdentityEntity {
	option (syncplane.v1.entity) = {
		name: "oneof_list_identity"
		key_fields: [ "id" ]
	};

	string id = 1;
	repeated VariantElement entries = 2
		[(syncplane.v1.field_behavior) = { key_field: "uid" }];
}

message VariantElement {
	oneof which {
		string uid = 1;
		int32 num = 2;
	}
	string label = 3;
}

// A polymorphic reference declared on the holder: a oneof whose members are
// entity-typed, so one row points at a project or at a user. The relation is
// followed by the oneof's name (target); each member is a case with its own
// derived index and reverse relation (oneofRefs on Project and on User).
message OneofRefEntity {
	option (syncplane.v1.entity) = {
		name: "oneof_ref"
		key_fields: [ "id" ]
	};

	string id = 1;
	oneof target {
		Project project = 2;
		User user = 3;
	}
}

// Element of a keyed message list (Widget.members). Not a registered entity;
// identity comes from the field's explicit key_field.
message Member {
	string uid = 1;
	string name = 2;
	int32 role = 3;
	// A list inside a list element — the shape an index component may not
	// descend into (one repeated field per component) and a nested any() can.
	repeated string tags = 4;
}

// Element of a movable list (Widget.items). "id" is the stable identity,
// "pos" is the framework-managed fractional order key.
message Item {
	string id = 1;
	string pos = 2;
	string text = 3;
}

// Composite key entity — exercises multi-field key derivation and separator
// escaping (distinct field tuples must not collide into one row key).
message Pair {
	option (syncplane.v1.entity) = {
		name: "pair"
		key_fields: [ "ns", "id" ]
	};

	string ns = 1;
	string id = 2;
	string label = 3;
}

// Reference fixtures. A field whose message type is a registered entity is a
// first-class typed reference: the stored row keeps only the target's key
// fields, the live target is resolved on read. Project/User are to-one targets;
// Issue exercises to-one (project, assignee, reporter), to-many self-ref
// (blocked_by) and a composite-key ref (pair).
message Project {
	option (syncplane.v1.entity) = {
		name: "project"
		key_fields: [ "id" ]
	};

	string id = 1;
	string name = 2;
}

message User {
	option (syncplane.v1.entity) = {
		name: "user"
		key_fields: [ "id" ]
	};

	string id = 1;
	string name = 2;
}

message Issue {
	option (syncplane.v1.entity) = {
		name: "issue"
		key_fields: [ "id" ]
		// Exercises the composite surface: a filter on `state` combined with an
		// ordering by `rank`, which is the shape a single-field index can only
		// serve by re-checking every candidate.
		index: {
			name: "by_state_rank"
			key: [ { path: "state" }, { path: "rank" desc: true } ]
		}
		// Fan-out: `labels` is repeated, so a row takes one position per
		// element. Pinned by the equality prefix it still supplies the ordering
		// that follows it, which is the shape "labelled X, newest first" needs.
		index: {
			name: "by_label_rank"
			key: [ { path: "labels" }, { path: "rank" desc: true } ]
		}
		// Map fan-out: `*` means "every entry of this map", and the selector
		// after it names the side of the entry the component stores. Key first,
		// so a probe on ONE user-defined field is a contiguous range.
		index: {
			name: "cf_number"
			key: [ { path: "custom.*.key" }, { path: "custom.*.value.number" } ]
		}
		// The mirror layout: value first, so a probe on a VALUE is contiguous
		// and "which custom field holds 5" is a range read rather than a scan.
		// Equality only — a range on the value would spread the keys out.
		index: {
			name: "cf_by_number"
			key: [ { path: "custom.*.value.number" }, { path: "custom.*.key" } ]
		}
		// A value component with NO key component beside it. The exactness
		// guard is what this exists for: a predicate naming one custom field
		// must stay in the residual against it, because the range spans that
		// value under every key.
		index: {
			name: "cf_number_only"
			key: [ { path: "custom.*.value.number" } ]
		}
		// The same fan-out with a second sort key: "custom field X, highest
		// rank first", which is what an ordering inside one custom field needs.
		index: {
			name: "cf_num_rank"
			key: [
				{ path: "custom.*.key" },
				{ path: "custom.*.value.number" },
				{ path: "rank" desc: true }
			]
		}
		// Nested fan-out: one entry per (entry key, list element). Multi-select
		// needs no engine concept — the app wraps a repeated scalar in a
		// variant.
		index: {
			name: "cf_labels"
			key: [
				{ path: "custom.*.key" },
				{ path: "custom.*.value.labels.values" }
			]
		}
		// A scalar-valued map, where both sides have to be nameable: `value` is
		// the entry's string, `key` its name. Cross-key over a plain
		// map<string, string>.
		index: {
			name: "tag_by_value"
			key: [ { path: "tags_map.*.value" }, { path: "tags_map.*.key" } ]
		}
	};

	string id = 1;
	string title = 2;
	// To-one ref: stores only project.id, resolved on read.
	Project project = 3;
	// To-many self-ref: each element stores only its id.
	repeated Issue blocked_by = 4;
	// Two refs to the same target — reverse accessor names disambiguate to
	// issuesByAssignee / issuesByReporter (the source entity pluralizes when a
	// single field targets it, else <source>By<Field>).
	User assignee = 5;
	User reporter = 6;
	// Composite-key ref: incomparable in queries except isSet/isNotSet.
	Pair pair = 7;
	// Field-level index mark — the single-field surface, desugared to a
	// one-component index.
	string state = 8 [(syncplane.v1.field_behavior) = { indexed: true }];
	// Second component of the composite index above; not marked itself, so it
	// exercises a component that only a declared index reaches.
	int32 rank = 9;
	// Repeated scalar with a field-level mark — the multi-entry surface, where
	// membership is a range read and one row occupies several positions.
	repeated string labels = 10
		[(syncplane.v1.field_behavior) = { indexed: true }];
	// User-defined fields, the shape an app declares for them: an app-defined
	// oneof per entry, addressed by key and variant. The indexes above fan out
	// over it.
	map<string, FieldValue> custom = 11;
	// A SCALAR-valued map. Both sides of an entry are ordinary values here, so
	// it is what pins that `key` and `value` are both nameable — for a
	// map<string, string> a bare `*` could mean either, which is why the
	// selector is required rather than defaulted.
	map<string, string> tags_map = 12;
}

// Workspace-qualified reference fixtures. UserRef is a reference message: it
// wraps a User stub together with the workspace that user lives in, so a Task
// may name a user held in another workspace. Task exercises the to-one
// (assignee) and to-many (watchers) shapes; the reverse relations land on User
// as tasksByAssignee / tasksByWatchers.
message UserRef {
	option (syncplane.v1.reference) = {
	};

	string workspace_id = 1
		[(syncplane.v1.field_behavior) = { workspace: true }];
	User user = 2;
}

message Task {
	option (syncplane.v1.entity) = {
		name: "task"
		key_fields: [ "id" ]
	};

	string id = 1;
	string title = 2;
	UserRef assignee = 3;
	repeated UserRef watchers = 4;
	string state = 5;
}

// Polymorphic reference fixtures. OwnerRef is a reference message whose
// target is a oneof: one stored value names a project or a user, in the
// workspace it records. Memo holds it to-one (owner) and to-many (mentions);
// the reverse relations land on Project and User as memosByOwner and
// memosByMentions.
message OwnerRef {
	option (syncplane.v1.reference) = {
	};

	string workspace_id = 1
		[(syncplane.v1.field_behavior) = { workspace: true }];
	oneof owner {
		Project project = 2;
		User user = 3;
	}
}

message Memo {
	option (syncplane.v1.entity) = {
		name: "memo"
		key_fields: [ "id" ]
	};

	string id = 1;
	OwnerRef owner = 2;
	repeated OwnerRef mentions = 3;
	string body = 4;
}

// A oneof on the holder mixing an entity-typed reference, a workspace-qualified
// reference message and a plain member: the two references are the cases of
// the parent relation, and the label is not a reference at all.
message Attachment {
	option (syncplane.v1.entity) = {
		name: "attachment"
		key_fields: [ "id" ]
	};

	string id = 1;
	oneof parent {
		Project project = 2;
		UserRef user = 3;
		string label = 4;
	}
	string name = 5;
}

message Settings {
	string color = 1;
	int32 size = 2;
	// Nested opaque field — exercises merge hooks under a path prefix.
	Blob inner = 3 [(syncplane.v1.field_behavior) = { opaque: true }];
	// Floating point behind a message that can be unset — the only way to put
	// a NaN and a MISSING value on the same order key, which is what pins
	// their relative rank.
	double ratio = 4;
}

// Stands in for a future CRDT blob (e.g. Loro).
message Blob {
	bytes data = 1;
	string note = 2;
}

// Search fixture exercising both declaration surfaces at once: `title` is
// marked searchable, so it counts as the most important field, ahead of the
// declared `summary`, `body` (collaborative text, searched as its plain
// string) and the nested `meta.author`.
message Article {
	option (syncplane.v1.entity) = {
		name: "article"
		key_fields: [ "id" ]
		search: {
			field: [
				{ path: "summary" },
				{ path: "body" },
				{ path: "meta.author" }
			]
		}
	};

	string id = 1;
	string title = 2 [(syncplane.v1.field_behavior) = { searchable: true }];
	string summary = 3;
	bytes body = 4 [(syncplane.v1.field_behavior) = { text: true }];
	ArticleMeta meta = 5;
	// Not searchable — a filter to compose with match in queries.
	string state = 6;
}

message ArticleMeta {
	string author = 1;
	string note = 2;
}

// Search fixture with diacritics kept significant: "café" and "cafe" are
// distinct terms here, where Article folds them together.
message Glossary {
	option (syncplane.v1.entity) = {
		name: "glossary"
		key_fields: [ "id" ]
		search: {
			field: [ { path: "term" }, { path: "definition" } ]
			keep_diacritics: true
		}
	};

	string id = 1;
	string term = 2;
	string definition = 3;
}

// Search-rejection fixtures. Each must fail registration: search reads
// singular string (or collaborative-text) fields only, and a declaration
// that names nothing has asked for a search that could never match.

// A search field path to a repeated field.
message SearchRepeatedEntity {
	option (syncplane.v1.entity) = {
		name: "search_repeated"
		key_fields: [ "id" ]
		search: { field: [ { path: "tags" } ] }
	};

	string id = 1;
	repeated string tags = 2;
}

// A searchable mark on a numeric field.
message SearchNumberEntity {
	option (syncplane.v1.entity) = {
		name: "search_number"
		key_fields: [ "id" ]
	};

	string id = 1;
	int32 count = 2 [(syncplane.v1.field_behavior) = { searchable: true }];
}

// A search declaration naming no fields, with none marked either.
message SearchEmptyEntity {
	option (syncplane.v1.entity) = {
		name: "search_empty"
		key_fields: [ "id" ]
		search: {}
	};

	string id = 1;
	string title = 2;
}

// Delete-policy fixture: an entity whose rows only a trusted write may delete.
// Stands in for the root objects a cascade hangs off, where deletion is meant
// to be a considered server-side act rather than a verb clients hold.
message Ledger {
	option (syncplane.v1.entity) = {
		name: "ledger"
		key_fields: [ "id" ]
		delete_policy: DELETE_POLICY_TRUSTED_ONLY
	};

	string id = 1;
	string label = 2;
}

// Write-policy fixture for a server-owned entity: the server records these
// rows and clients only read them. Stands in for an activity feed written by
// effects and connectors.
message Activity {
	option (syncplane.v1.entity) = {
		name: "activity"
		key_fields: [ "id" ]
		create_policy: CREATE_POLICY_TRUSTED_ONLY
		update_policy: UPDATE_POLICY_TRUSTED_ONLY
		delete_policy: DELETE_POLICY_TRUSTED_ONLY
	};

	string id = 1;
	string what = 2;
}

// Write-policy fixture for an append-only entity: a client may post a row but
// not edit or remove it afterwards. Stands in for comments, where edits go
// through a mutator that checks authorship.
message Comment {
	option (syncplane.v1.entity) = {
		name: "comment"
		key_fields: [ "id" ]
		update_policy: UPDATE_POLICY_TRUSTED_ONLY
		delete_policy: DELETE_POLICY_TRUSTED_ONLY
	};

	string id = 1;
	string body = 2;
}

// History fixture with a NARROWED capture set: `title` and `body` are marked,
// `note` is not, so a write that touches only `note` records nothing. `body` is
// collaborative text, which is what makes the restore-is-a-PATCH trap
// observable — restoring it as a PUT would union the old text back in instead
// of replacing it.
message Historied {
	option (syncplane.v1.entity) = {
		name: "historied"
		key_fields: [ "id" ]
		history: {}
	};

	string id = 1;
	string title = 2 [(syncplane.v1.field_behavior) = { history: true }];
	bytes body = 3
		[(syncplane.v1.field_behavior) = { text: true history: true }];
	string note = 4;
}

// History capture of documents inside keyed elements: marking the list marks
// the unit, and each element's document reduces to its visible text in the
// recorded before-state.
message HistoriedKeyedText {
	option (syncplane.v1.entity) = {
		name: "historied_keyed_text"
		key_fields: [ "id" ]
		history: {}
	};

	string id = 1;
	repeated KeyedNote notes = 2 [(syncplane.v1.field_behavior) = {
		key_field: [ "id" ]
		history: true
	}];
}

// History fixture whose capture set covers EVERY non-key field, spelled out one
// mark at a time. There is no capture-everything default to lean on, so the
// difference between this and Historied is only what the marks say.
message HistoriedAll {
	option (syncplane.v1.entity) = {
		name: "historied_all"
		key_fields: [ "id" ]
		history: {}
	};

	string id = 1;
	string title = 2 [(syncplane.v1.field_behavior) = { history: true }];
	int32 count = 3 [(syncplane.v1.field_behavior) = { history: true }];
}

// History fixture carrying a ONEOF. A oneof is one field to the merge, named by
// its group, so the capture set has to name it that way too — a mask naming a
// member could neither record a prior value nor be handed back to a restore.
// Marking one member is what marks the group.
message HistoriedOneof {
	option (syncplane.v1.entity) = {
		name: "historied_oneof"
		key_fields: [ "id" ]
		history: {}
	};

	string id = 1;
	string label = 2;
	oneof choice {
		string choice_text = 3
			[(syncplane.v1.field_behavior) = { history: true }];
		int32 choice_number = 4;
	}
}

// History fixture carrying a NESTED message field. A capture set names
// top-level units, but a PATCH mask may point inside one and a record keeps the
// sub-path it was given, so this is the only shape where a session records
// "settings.color" and then folds in a write naming the whole of "settings".
message HistoriedNested {
	option (syncplane.v1.entity) = {
		name: "historied_nested"
		key_fields: [ "id" ]
		history: {}
	};

	string id = 1;
	Settings settings = 2 [(syncplane.v1.field_behavior) = { history: true }];
}

// History fixture that opts the entity in and marks NOTHING. Registering it is
// an error: capture is explicit, and an entity that names no field has asked
// for a log that could never say anything.
message HistoriedUnmarked {
	option (syncplane.v1.entity) = {
		name: "historied_unmarked"
		key_fields: [ "id" ]
		history: {}
	};

	string id = 1;
	string title = 2;
}
