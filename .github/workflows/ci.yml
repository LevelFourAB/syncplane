# Each job runs one task from Taskfile.yml, so a contributor reproduces a failure
# with mise and the task the failing job names. `task ci` runs all of them in
# sequence on a local machine.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pushes to main stay serialized, so a red main is never hidden by a newer run
  # that cancelled it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protobuf:
    name: protobuf lint and breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `buf breaking` reads main out of the local clone (.git#branch=main),
          # so it needs the history and not a shallow tip.
          fetch-depth: 0

      - name: Create a local main for the protobuf breaking check
        # A pull_request build checks out a detached merge commit, which leaves
        # no refs/heads/main. Without this step the breaking task finds no main
        # and skips itself - silently, on the one event where it matters most.
        if: github.ref_name != 'main'
        run: git fetch --no-tags origin main:main

      - uses: ./.github/actions/setup

      - run: task lint
      - run: task breaking

  vet:
    name: task vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          go: 'true'
      - run: task vet

  typecheck:
    name: task typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          client: 'true'
      - run: task typecheck

  test-go:
    name: task test:go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          go: 'true'
      # Docker is available on the runner, so the pgstore, pglisten, pgnotify and
      # pgpresence suites start their Postgres container and run for real instead
      # of skipping.
      - run: task test:go

  test-ts:
    name: task test:ts:${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      # One failing suite does not hide the result of the others.
      fail-fast: false
      matrix:
        suite: [ unit, react, integration ]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          # The integration suite builds and spawns the Go testserver.
          go: ${{ matrix.suite == 'integration' }}
          client: 'true'
      - run: task test:ts:${{ matrix.suite }}

  generated:
    name: generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - run: task generate

      - name: Fail if regeneration changed a checked-in file
        # --intent-to-add puts new files into the diff, which a plain diff does
        # not see.
        run: |
          git add --intent-to-add --all
          git diff --exit-code

  ci:
    # Keeps the `task ci` check name that branch protection requires, so the
    # split into parallel jobs needs no change to the repository settings. It
    # also runs when a job it needs fails, and fails with it.
    name: task ci
    if: always()
    needs: [ protobuf, vet, typecheck, test-go, test-ts ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every check passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
